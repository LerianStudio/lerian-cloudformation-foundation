AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Foundation Infrastructure Stack
  Deploys shared VPC, EKS, and supporting services (Route53, ALB Controller, ExternalDNS),
  and enrolls the Lerian agent in the cluster so the control plane can install products into it.
  Product stacks receive this stack's outputs as parameters (ExistingVpcId, ExistingClusterName, etc.).
  (c) Lerian Studio - https://lerian.studio

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "AWS Marketplace Configuration"
        Parameters:
          - MPS3BucketName
          - MPS3BucketRegion
          - MPS3KeyPrefix
          - MarketplaceAMI
      - Label:
          default: "General Configuration"
        Parameters:
          - EnvironmentName
          - ProjectName
          - PermissionsBoundaryArn
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcCIDR
          - AvailabilityZone1
          - AvailabilityZone2
          - AvailabilityZone3
          - EnableFlowLogs
          - FlowLogsRetentionDays
      - Label:
          default: "EKS Configuration"
        Parameters:
          - KubernetesVersion
          - NodeInstanceType
          - NodeGroupMinSize
          - NodeGroupMaxSize
          - NodeGroupDesiredSize
      - Label:
          default: "DNS and Ingress Configuration"
        Parameters:
          - DomainName
          - EnableALBController
          - EnableExternalDNS
      - Label:
          default: "Lerian Control Plane"
        Parameters:
          - ControlPlaneURL
          - EnrollmentToken
          - AgentChartVersion
          - AgentChartDigest
    ParameterLabels:
      # AWS Marketplace
      MPS3BucketName:
        default: "Template S3 Bucket Name"
      MPS3BucketRegion:
        default: "Template S3 Bucket Region"
      MPS3KeyPrefix:
        default: "Template S3 Key Prefix"
      MarketplaceAMI:
        default: "Marketplace AMI ID"
      # General
      EnvironmentName:
        default: "Environment"
      ProjectName:
        default: "Project Name"
      PermissionsBoundaryArn:
        default: "IAM Permissions Boundary ARN"
      # Network
      VpcCIDR:
        default: "VPC CIDR Block"
      AvailabilityZone1:
        default: "Availability Zone 1"
      AvailabilityZone2:
        default: "Availability Zone 2"
      AvailabilityZone3:
        default: "Availability Zone 3"
      EnableFlowLogs:
        default: "Enable VPC Flow Logs"
      FlowLogsRetentionDays:
        default: "Flow Logs Retention (Days)"
      # EKS
      KubernetesVersion:
        default: "Kubernetes Version"
      NodeInstanceType:
        default: "Node Instance Type"
      NodeGroupMinSize:
        default: "Minimum Nodes"
      NodeGroupMaxSize:
        default: "Maximum Nodes"
      NodeGroupDesiredSize:
        default: "Desired Nodes"
      # DNS
      DomainName:
        default: "Domain Name (Optional)"
      EnableALBController:
        default: "Enable ALB Controller"
      EnableExternalDNS:
        default: "Enable ExternalDNS"
      # Lerian Control Plane
      ControlPlaneURL:
        default: "Control Plane URL"
      EnrollmentToken:
        default: "Agent Enrollment Token"
      AgentChartVersion:
        default: "Agent Chart Version"
      AgentChartDigest:
        default: "Agent Chart Digest (Optional)"

Parameters:
  # =============================================================================
  # AWS MARKETPLACE PARAMETERS (Required for Nested Stacks)
  # =============================================================================
  MPS3BucketName:
    Type: String
    Description: "S3 bucket name containing the CloudFormation templates (managed by AWS Marketplace)"
    Default: "lerian-cloudformation-templates"

  MPS3BucketRegion:
    Type: String
    Description: "AWS Region where the S3 bucket is located (fixed to sa-east-1)"
    Default: "sa-east-1"
    AllowedValues:
      - sa-east-1

  MPS3KeyPrefix:
    Type: String
    Description: "S3 key prefix for the CloudFormation templates"
    Default: "releases/latest/"
    AllowedPattern: "^[a-zA-Z0-9-_./]*$"
    ConstraintDescription: "Key prefix can include alphanumeric characters, hyphens, underscores, periods, and forward slashes"

  # The Marketplace listing is an AmiProduct entity, so each delivery option has
  # to bind its AMI to a parameter of the launched template (TemplateSources /
  # ParameterName). This stack has no use for it - EKS node groups run the
  # AL2023 ARM64 managed AMI - but without the parameter the AddDeliveryOptions
  # changeset is rejected for naming a parameter the template does not declare.
  MarketplaceAMI:
    Type: String
    Description: "AWS Marketplace AMI ID (required by the Marketplace delivery option form only, EKS uses managed AMIs)"
    Default: "ami-placeholder"

  # =============================================================================
  # GENERAL CONFIGURATION
  # =============================================================================
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: "Optional IAM permissions boundary ARN. Applied to all IAM roles created by this stack. Leave empty to skip."

  EnvironmentName:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name for resource tagging

  ProjectName:
    Type: String
    Default: lerian
    Description: Project name used for resource naming (shared across all products)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]*$"
    MinLength: 3
    MaxLength: 128
    ConstraintDescription: "Must begin with a letter, contain only letters, numbers, and hyphens, and be 3-128 characters long"

  # Network
  VpcCIDR:
    Type: String
    Default: 10.50.0.0/16
    Description: CIDR block for the VPC
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$

  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-2a
    Description: First Availability Zone

  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-2b
    Description: Second Availability Zone

  AvailabilityZone3:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-2c
    Description: Third Availability Zone

  EnableFlowLogs:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
    Description: Enable VPC Flow Logs for network traffic auditing and security analysis.

  FlowLogsRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653
    Description: Number of days to retain VPC Flow Logs in CloudWatch.

  # EKS
  KubernetesVersion:
    Type: String
    Default: "1.35"
    AllowedValues:
      - "1.33"
      - "1.34"
      - "1.35"
    Description: Kubernetes version for EKS cluster

  NodeInstanceType:
    Type: String
    Default: c7g.large
    AllowedValues:
      - c7g.medium
      - c7g.large
      - c7g.xlarge
      - c7g.2xlarge
      - m7g.medium
      - m7g.large
      - m7g.xlarge
      - m7g.2xlarge
      - r7g.medium
      - r7g.large
      - r7g.xlarge
      - c6g.medium
      - c6g.large
      - c6g.xlarge
      - c6g.2xlarge
      - m6g.medium
      - m6g.large
      - m6g.xlarge
    Description: EC2 instance type for EKS worker nodes (ARM64 Graviton)

  NodeGroupMinSize:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 100
    Description: Minimum number of worker nodes

  NodeGroupMaxSize:
    Type: Number
    Default: 15
    MinValue: 1
    MaxValue: 100
    Description: Maximum number of worker nodes

  NodeGroupDesiredSize:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 100
    Description: Desired number of worker nodes

  # =============================================================================
  # DNS AND INGRESS CONFIGURATION
  # =============================================================================
  DomainName:
    Type: String
    Default: ""
    Description: Domain name for Route53 private hosted zone (e.g., empresa.com). Leave empty to skip DNS setup.
    AllowedPattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?(\\.[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?)*$"
    ConstraintDescription: "Must be a valid domain name (e.g., example.com or sub.example.com) or empty"

  EnableALBController:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable AWS Load Balancer Controller for Ingress

  EnableExternalDNS:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable ExternalDNS for automatic DNS management (requires DomainName)

  # =============================================================================
  # LERIAN CONTROL PLANE (AGENT ENROLLMENT)
  # =============================================================================
  ControlPlaneURL:
    Type: String
    Default: ""
    Description: "Base URL of the Lerian control plane, e.g. https://api.lerian.studio. Together with EnrollmentToken and AgentChartVersion this installs the Lerian agent in the cluster. Leave all three empty for a cluster with no control-plane connection."
    AllowedPattern: "^$|^https://[a-zA-Z0-9.-]+(:[0-9]{1,5})?(/.*)?$"
    ConstraintDescription: "Must be empty or an https:// URL"

  EnrollmentToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Single-use enrollment token issued by the Lerian control plane for this tenant. Required together with ControlPlaneURL to install the agent."

  AgentChartVersion:
    Type: String
    Default: ""
    Description: "Version of the lerian-agent Helm chart to install. Required when the agent is enabled; deliberately has no version default so a stale agent is never installed silently."
    AllowedPattern: "^$|^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"
    ConstraintDescription: "Must be empty or an exact semantic version (e.g. 1.4.0)"

  AgentChartDigest:
    Type: String
    Default: ""
    Description: "Optional OCI manifest digest pinning the agent chart, e.g. sha256:<64 hex>. When set, the install is rejected unless AgentChartVersion resolves to it."
    AllowedPattern: "^$|^sha256:[a-f0-9]{64}$"
    ConstraintDescription: "Must be empty or a sha256:<64 hex characters> digest"

# Rules run before CloudFormation creates anything, so a half-filled agent
# parameter set is rejected at the CreateStack call. Left to a Condition, the
# same mistake would build the VPC and the EKS cluster first - roughly twenty
# minutes - and only then fail the nested agent stack and roll all of it back.
#
# Every agent parameter appears in the RuleCondition, AgentChartDigest included:
# touching any one of them means the agent is wanted, so the three required ones
# are asserted. A digest supplied on its own would otherwise pass silently and
# leave a cluster with no agent and no error.
Rules:
  AgentParametersComplete:
    RuleCondition: !Or
      - !Not [!Equals [!Ref ControlPlaneURL, ""]]
      - !Not [!Equals [!Ref EnrollmentToken, ""]]
      - !Not [!Equals [!Ref AgentChartVersion, ""]]
      - !Not [!Equals [!Ref AgentChartDigest, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref ControlPlaneURL, ""]]
        AssertDescription: "ControlPlaneURL is required to install the Lerian agent. Supply ControlPlaneURL, EnrollmentToken and AgentChartVersion together, or leave every agent parameter empty - AgentChartDigest included - for a cluster with no control-plane connection."
      - Assert: !Not [!Equals [!Ref EnrollmentToken, ""]]
        AssertDescription: "EnrollmentToken is required to install the Lerian agent. Supply ControlPlaneURL, EnrollmentToken and AgentChartVersion together, or leave every agent parameter empty - AgentChartDigest included - for a cluster with no control-plane connection."
      - Assert: !Not [!Equals [!Ref AgentChartVersion, ""]]
        AssertDescription: "AgentChartVersion is required to install the Lerian agent. It has no default so a stale agent is never installed silently - supply the version you intend to run. AgentChartDigest alone is not enough."

Conditions:
  HasDomainName: !Not [!Equals [!Ref DomainName, ""]]
  ShouldEnableALBController: !Equals [!Ref EnableALBController, "true"]
  ShouldEnableExternalDNS: !And
    - !Condition HasDomainName
    - !Equals [!Ref EnableExternalDNS, "true"]
  # The Rules section above already guarantees these two arrive together with a
  # chart version, so this condition only separates "agent wanted" from "agent
  # not wanted"; it never has to describe a half-filled parameter set.
  ShouldDeployAgent: !And
    - !Not [!Equals [!Ref ControlPlaneURL, ""]]
    - !Not [!Equals [!Ref EnrollmentToken, ""]]

Resources:
  # =============================================================================
  # VPC STACK
  # =============================================================================
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}vpc.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        VpcCIDR: !Ref VpcCIDR
        AvailabilityZone1: !Ref AvailabilityZone1
        AvailabilityZone2: !Ref AvailabilityZone2
        AvailabilityZone3: !Ref AvailabilityZone3
        EnableFlowLogs: !Ref EnableFlowLogs
        FlowLogsRetentionDays: !Ref FlowLogsRetentionDays
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # EKS STACK
  # =============================================================================
  EKSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VPCStack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}eks.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt VPCStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt VPCStack.Outputs.PrivateSubnetIds
        KubernetesVersion: !Ref KubernetesVersion
        NodeInstanceType: !Ref NodeInstanceType
        NodeGroupMinSize: !Ref NodeGroupMinSize
        NodeGroupMaxSize: !Ref NodeGroupMaxSize
        NodeGroupDesiredSize: !Ref NodeGroupDesiredSize
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-eks-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # ROUTE53 STACK (Private Hosted Zone)
  # =============================================================================
  Route53Stack:
    Type: AWS::CloudFormation::Stack
    Condition: HasDomainName
    DependsOn: VPCStack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}route53.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        DomainName: !Ref DomainName
        VpcId: !GetAtt VPCStack.Outputs.VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-route53-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # ALB CONTROLLER STACK
  # =============================================================================
  ALBControllerStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldEnableALBController
    DependsOn: EKSStack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}alb-controller.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt VPCStack.Outputs.VpcId
        ClusterName: !GetAtt EKSStack.Outputs.ClusterName
        OIDCProviderArn: !GetAtt EKSStack.Outputs.OIDCProviderArn
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-controller-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # EXTERNAL DNS STACK
  # =============================================================================
  ExternalDNSStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldEnableExternalDNS
    DependsOn:
      - EKSStack
      - Route53Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}external-dns.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        ClusterName: !GetAtt EKSStack.Outputs.ClusterName
        OIDCProviderArn: !GetAtt EKSStack.Outputs.OIDCProviderArn
        PrivateHostedZoneId: !GetAtt Route53Stack.Outputs.PrivateHostedZoneId
        DomainName: !Ref DomainName
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-external-dns-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # LERIAN AGENT STACK
  # =============================================================================
  # Last stack in the chain and the end of the deployment story told here: once
  # the agent is enrolled, the control plane installs products into this cluster.
  AgentStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployAgent
    DependsOn: EKSStack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}agent.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        ClusterName: !GetAtt EKSStack.Outputs.ClusterName
        ControlPlaneURL: !Ref ControlPlaneURL
        EnrollmentToken: !Ref EnrollmentToken
        AgentChartVersion: !Ref AgentChartVersion
        AgentChartDigest: !Ref AgentChartDigest
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-agent-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  # =============================================================================
  # STACK METADATA
  # =============================================================================
  ProjectName:
    Description: Project name used in this deployment
    Value: !Ref ProjectName

  EnvironmentName:
    Description: Environment name
    Value: !Ref EnvironmentName

  # =============================================================================
  # VPC OUTPUTS (auto-imported by product stacks via FoundationStackName)
  # =============================================================================
  VpcId:
    Description: VPC ID
    Value: !GetAtt VPCStack.Outputs.VpcId
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  VpcCIDR:
    Description: VPC CIDR Block
    Value: !Ref VpcCIDR
    Export:
      Name: !Sub "${AWS::StackName}-VpcCIDR"

  PrivateSubnetIds:
    Description: Private Subnet IDs
    Value: !GetAtt VPCStack.Outputs.PrivateSubnetIds
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"

  DatabaseSubnetIds:
    Description: Database Subnet IDs (isolated subnets for databases)
    Value: !GetAtt VPCStack.Outputs.DatabaseSubnetIds
    Export:
      Name: !Sub "${AWS::StackName}-DatabaseSubnetIds"

  # =============================================================================
  # EKS OUTPUTS (auto-imported by product stacks via FoundationStackName)
  # =============================================================================
  EKSClusterName:
    Description: EKS Cluster Name
    Value: !GetAtt EKSStack.Outputs.ClusterName
    Export:
      Name: !Sub "${AWS::StackName}-EKSClusterName"

  EKSClusterEndpoint:
    Description: EKS Cluster Endpoint
    Value: !GetAtt EKSStack.Outputs.ClusterEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-EKSClusterEndpoint"

  OIDCProviderArn:
    Description: EKS OIDC Provider ARN
    Value: !GetAtt EKSStack.Outputs.OIDCProviderArn
    Export:
      Name: !Sub "${AWS::StackName}-OIDCProviderArn"

  ClusterSecurityGroupId:
    Description: EKS Cluster Security Group ID
    Value: !GetAtt EKSStack.Outputs.ClusterSecurityGroupId
    Export:
      Name: !Sub "${AWS::StackName}-ClusterSecurityGroupId"

  # =============================================================================
  # ROUTE53 OUTPUTS
  # =============================================================================
  PrivateHostedZoneId:
    Condition: HasDomainName
    Description: Route53 Private Hosted Zone ID
    Value: !GetAtt Route53Stack.Outputs.PrivateHostedZoneId

  PrivateHostedZoneName:
    Condition: HasDomainName
    Description: Route53 Private Hosted Zone Name
    Value: !GetAtt Route53Stack.Outputs.PrivateHostedZoneName

  # =============================================================================
  # ALB CONTROLLER OUTPUTS
  # =============================================================================
  ALBControllerRoleArn:
    Condition: ShouldEnableALBController
    Description: ALB Controller IAM Role ARN
    Value: !GetAtt ALBControllerStack.Outputs.ALBControllerRoleArn

  # =============================================================================
  # EXTERNAL DNS OUTPUTS
  # =============================================================================
  ExternalDNSRoleArn:
    Condition: ShouldEnableExternalDNS
    Description: ExternalDNS IAM Role ARN
    Value: !GetAtt ExternalDNSStack.Outputs.ExternalDNSRoleArn

  # =============================================================================
  # LERIAN AGENT OUTPUTS
  # =============================================================================
  AgentNamespace:
    Condition: ShouldDeployAgent
    Description: Kubernetes namespace the Lerian agent runs in
    Value: !GetAtt AgentStack.Outputs.AgentNamespace

  AgentChartVersion:
    Condition: ShouldDeployAgent
    Description: Version of the lerian-agent chart installed in this cluster
    Value: !GetAtt AgentStack.Outputs.AgentChartVersion

  AgentLogGroup:
    Condition: ShouldDeployAgent
    Description: CloudWatch Log Group holding the agent installation log
    Value: !GetAtt AgentStack.Outputs.AgentLogGroup

  # =============================================================================
  # UTILITY COMMANDS
  # =============================================================================
  KubeconfigCommand:
    Description: Command to configure kubectl
    Value: !Sub "aws eks update-kubeconfig --name ${EKSStack.Outputs.ClusterName} --region ${AWS::Region}"

  DeployProductCommand:
    Description: |
      Example command to deploy a product infrastructure stack using this foundation.
      The product stack auto-imports values via FoundationStackName.
    Value: !Sub |
      aws cloudformation deploy \
        --stack-name midaz-infra \
        --template-url https://${MPS3BucketName}.s3.${MPS3BucketRegion}.amazonaws.com/${MPS3KeyPrefix}products/midaz/infrastructure.yaml \
        --parameter-overrides \
          MPS3BucketName=${MPS3BucketName} \
          MPS3BucketRegion=${MPS3BucketRegion} \
          MPS3KeyPrefix=${MPS3KeyPrefix} \
          FoundationStackName=${AWS::StackName} \
        --capabilities CAPABILITY_IAM \
        --region ${AWS::Region}
