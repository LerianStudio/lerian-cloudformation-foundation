AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon MSK (Kafka) Stack for Lerian Platform — streaming backbone (SASL/SCRAM over TLS)

Parameters:
  ProjectName:
    Type: String
    Description: Project name for resource naming
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]*$"
    ConstraintDescription: "Must begin with a letter and contain only letters, numbers, and hyphens"

  EnvironmentName:
    Type: String
    Description: Environment name for tagging
    AllowedValues:
      - development
      - staging
      - production

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID

  VpcCIDR:
    Type: String
    Description: VPC CIDR block for security group rules
    AllowedPattern: "^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block (e.g., 10.0.0.0/16)"

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs. MSK spreads brokers across the first N (= NumberOfBrokerNodes) subnets, each in a distinct AZ.

  InstanceType:
    Type: String
    Description: MSK broker instance type
    Default: kafka.m5.large
    AllowedValues:
      - kafka.t3.small
      - kafka.m5.large
      - kafka.m5.xlarge
      - kafka.m5.2xlarge
      - kafka.m5.4xlarge
      - kafka.m7g.large
      - kafka.m7g.xlarge
      - kafka.m7g.2xlarge
      - kafka.m7g.4xlarge

  KafkaVersion:
    Type: String
    Description: Apache Kafka version
    Default: "3.6.0"

  NumberOfBrokerNodes:
    Type: Number
    Description: Number of broker nodes (must equal the number of ClientSubnets used; 2 for two AZs).
    Default: 2
    AllowedValues: [2, 3]

  BrokerStorageGB:
    Type: Number
    Description: EBS storage per broker (GiB)
    Default: 20
    MinValue: 10
    MaxValue: 16384

  SASLUsername:
    Type: String
    Description: SASL/SCRAM username (sensitive)
    NoEcho: true
    Default: lerian_streaming
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  AdditionalIngressCIDR1:
    Type: String
    Default: ""
    Description: "Additional CIDR block for broker access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

  AdditionalIngressCIDR2:
    Type: String
    Default: ""
    Description: "Additional CIDR block for broker access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

  AdditionalIngressCIDR3:
    Type: String
    Default: ""
    Description: "Additional CIDR block for broker access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

Conditions:
  IsThreeBroker: !Equals [!Ref NumberOfBrokerNodes, 3]
  HasAdditionalCIDR1: !And
    - !Not [!Equals [!Ref AdditionalIngressCIDR1, ""]]
    - !Not [!Equals [!Ref AdditionalIngressCIDR1, !Ref VpcCIDR]]
  HasAdditionalCIDR2: !And
    - !Not [!Equals [!Ref AdditionalIngressCIDR2, ""]]
    - !Not [!Equals [!Ref AdditionalIngressCIDR2, !Ref VpcCIDR]]
    - !Not [!Equals [!Ref AdditionalIngressCIDR2, !Ref AdditionalIngressCIDR1]]
  HasAdditionalCIDR3: !And
    - !Not [!Equals [!Ref AdditionalIngressCIDR3, ""]]
    - !Not [!Equals [!Ref AdditionalIngressCIDR3, !Ref VpcCIDR]]
    - !Not [!Equals [!Ref AdditionalIngressCIDR3, !Ref AdditionalIngressCIDR1]]
    - !Not [!Equals [!Ref AdditionalIngressCIDR3, !Ref AdditionalIngressCIDR2]]

Resources:
  # =============================================================================
  # KMS KEY (storage-at-rest encryption + SASL/SCRAM secret encryption)
  # =============================================================================
  MSKKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for MSK storage + SASL/SCRAM secret encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: '*'
          - Sid: Allow MSK to use the key for SCRAM secret decryption
            Effect: Allow
            Principal:
              Service: kafka.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-msk-kms"
        - Key: Environment
          Value: !Ref EnvironmentName

  MSKKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-msk"
      TargetKeyId: !Ref MSKKMSKey

  # =============================================================================
  # SASL/SCRAM SECRET
  # MSK requires the secret name to start with "AmazonMSK_" and be encrypted
  # with a customer-managed KMS key (never the default aws/secretsmanager key).
  # =============================================================================
  MSKScramSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "AmazonMSK_${ProjectName}_streaming"
      Description: MSK SASL/SCRAM credentials for the Lerian streaming backbone
      KmsKeyId: !GetAtt MSKKMSKey.Arn
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${SASLUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        # Alphanumeric: SASL passwords flow through connection strings/clients that
        # do not universally escape punctuation.
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-msk-scram-secret"
        - Key: Environment
          Value: !Ref EnvironmentName

  # =============================================================================
  # SECURITY GROUP
  # 9096 = SASL/SCRAM over TLS (client), 9094 = TLS (client), 2182 = TLS ZooKeeper.
  # =============================================================================
  MSKSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-msk-sg"
      GroupDescription: Security group for Amazon MSK
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9096
          ToPort: 9096
          CidrIp: !Ref VpcCIDR
          Description: Kafka SASL/SCRAM over TLS from VPC
        - IpProtocol: tcp
          FromPort: 9094
          ToPort: 9094
          CidrIp: !Ref VpcCIDR
          Description: Kafka TLS from VPC
        - IpProtocol: tcp
          FromPort: 2182
          ToPort: 2182
          CidrIp: !Ref VpcCIDR
          Description: TLS ZooKeeper from VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-msk-sg"
        - Key: Environment
          Value: !Ref EnvironmentName

  # =============================================================================
  # ADDITIONAL NETWORK ACCESS (Conditional) — SASL/SCRAM port 9096
  # =============================================================================
  AdditionalIngressSasl1:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasAdditionalCIDR1
    Properties:
      GroupId: !Ref MSKSecurityGroup
      IpProtocol: tcp
      FromPort: 9096
      ToPort: 9096
      CidrIp: !Ref AdditionalIngressCIDR1
      Description: "Additional SASL/SCRAM access 1"

  AdditionalIngressSasl2:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasAdditionalCIDR2
    Properties:
      GroupId: !Ref MSKSecurityGroup
      IpProtocol: tcp
      FromPort: 9096
      ToPort: 9096
      CidrIp: !Ref AdditionalIngressCIDR2
      Description: "Additional SASL/SCRAM access 2"

  AdditionalIngressSasl3:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasAdditionalCIDR3
    Properties:
      GroupId: !Ref MSKSecurityGroup
      IpProtocol: tcp
      FromPort: 9096
      ToPort: 9096
      CidrIp: !Ref AdditionalIngressCIDR3
      Description: "Additional SASL/SCRAM access 3"

  # =============================================================================
  # MSK CLUSTER
  # =============================================================================
  MSKCluster:
    Type: AWS::MSK::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-msk"
      KafkaVersion: !Ref KafkaVersion
      NumberOfBrokerNodes: !Ref NumberOfBrokerNodes
      BrokerNodeGroupInfo:
        InstanceType: !Ref InstanceType
        ClientSubnets: !If
          - IsThreeBroker
          - - !Select [0, !Ref PrivateSubnetIds]
            - !Select [1, !Ref PrivateSubnetIds]
            - !Select [2, !Ref PrivateSubnetIds]
          - - !Select [0, !Ref PrivateSubnetIds]
            - !Select [1, !Ref PrivateSubnetIds]
        SecurityGroups:
          - !Ref MSKSecurityGroup
        StorageInfo:
          EBSStorageInfo:
            VolumeSize: !Ref BrokerStorageGB
      EncryptionInfo:
        EncryptionAtRest:
          DataVolumeKMSKeyId: !Ref MSKKMSKey
        EncryptionInTransit:
          ClientBroker: TLS
          InCluster: true
      ClientAuthentication:
        Sasl:
          Scram:
            Enabled: true
      EnhancedMonitoring: PER_BROKER
      Tags:
        Name: !Sub "${ProjectName}-msk"
        Environment: !Ref EnvironmentName
        ManagedBy: CloudFormation

  # Associate the SASL/SCRAM secret with the cluster so the credentials are valid.
  MSKScramSecretAssociation:
    Type: AWS::MSK::BatchScramSecret
    Properties:
      ClusterArn: !Ref MSKCluster
      SecretArnList:
        - !Ref MSKScramSecret

Outputs:
  ClusterArn:
    Description: MSK Cluster ARN (deployer calls kafka:GetBootstrapBrokers on it)
    Value: !Ref MSKCluster

  ClusterName:
    Description: MSK Cluster name
    Value: !Sub "${ProjectName}-msk"

  SecretArn:
    Description: MSK SASL/SCRAM credentials Secret ARN
    Value: !Ref MSKScramSecret

  SecurityGroupId:
    Description: MSK Security Group ID
    Value: !Ref MSKSecurityGroup

  KMSKeyArn:
    Description: MSK KMS Key ARN
    Value: !GetAtt MSKKMSKey.Arn
