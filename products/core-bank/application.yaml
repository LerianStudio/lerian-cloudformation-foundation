AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Core Bank Application Stack
  Deploys the full Core Bank product suite via Helm to an existing EKS cluster.
  Requires core-bank-infrastructure stack to be deployed first.
  Includes: Ledger (Midaz), Reporter, Tracer, Product Console, Plugin Fees.
  (c) Lerian Studio - https://lerian.studio

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General Configuration"
        Parameters:
          - PermissionsBoundaryArn
      - Label:
          default: "Infrastructure Reference"
        Parameters:
          - InfrastructureStackName
      - Label:
          default: "AWS Marketplace Configuration"
        Parameters:
          - MPS3BucketName
          - MPS3BucketRegion
          - MPS3KeyPrefix
          - MarketplaceAMI
      - Label:
          default: "Core Bank Configuration"
        Parameters:
          - CoreBankVersion
          - CoreBankReplicas
          - CoreBankNamespace
      - Label:
          default: "Console Configuration"
        Parameters:
          - NextAuthUrl
      - Label:
          default: "Ingress Configuration"
        Parameters:
          - EnableIngress
          - IngressHostname
          - IngressScheme
          - IngressCertificateArn
    ParameterLabels:
      PermissionsBoundaryArn:
        default: "IAM Permissions Boundary ARN"
      InfrastructureStackName:
        default: "Infrastructure Stack Name"
      MPS3BucketName:
        default: "Template S3 Bucket Name"
      MPS3BucketRegion:
        default: "Template S3 Bucket Region"
      MPS3KeyPrefix:
        default: "Template S3 Key Prefix"
      MarketplaceAMI:
        default: "Marketplace AMI ID"
      CoreBankVersion:
        default: "Core Bank Chart Version"
      CoreBankReplicas:
        default: "Number of Ledger Replicas"
      CoreBankNamespace:
        default: "Kubernetes Namespace"
      NextAuthUrl:
        default: "Console Public URL"
      EnableIngress:
        default: "Enable Console Ingress (ALB)"
      IngressHostname:
        default: "Console Ingress Hostname"
      IngressScheme:
        default: "Ingress Scheme"
      IngressCertificateArn:
        default: "ACM Certificate ARN"

Parameters:
  # =============================================================================
  # GENERAL CONFIGURATION
  # =============================================================================
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: "Optional IAM permissions boundary ARN. Applied to all IAM roles created by this stack. Leave empty to skip."

  # =============================================================================
  # INFRASTRUCTURE REFERENCE
  # =============================================================================
  InfrastructureStackName:
    Type: String
    Description: "Name of the core-bank-infrastructure CloudFormation stack"
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]*$"
    ConstraintDescription: "Must be a valid CloudFormation stack name"

  # =============================================================================
  # AWS MARKETPLACE PARAMETERS
  # =============================================================================
  MPS3BucketName:
    Type: String
    Description: "S3 bucket name containing the CloudFormation templates"
    Default: "lerian-cloudformation-templates"

  MPS3BucketRegion:
    Type: String
    Description: "AWS Region where the S3 bucket is located (fixed to sa-east-1)"
    Default: "sa-east-1"
    AllowedValues:
      - sa-east-1

  MPS3KeyPrefix:
    Type: String
    Description: "S3 key prefix for the CloudFormation templates"
    Default: "releases/latest/products/core-bank/"
    AllowedPattern: "^[a-zA-Z0-9-_./]*$"
    ConstraintDescription: "Key prefix can include alphanumeric characters, hyphens, underscores, periods, and forward slashes"

  MarketplaceAMI:
    Type: String
    Description: "AWS Marketplace AMI ID (required by Marketplace form only, EKS uses managed AMIs)"
    Default: "ami-placeholder"

  # =============================================================================
  # CORE BANK CONFIGURATION
  # =============================================================================
  CoreBankVersion:
    Type: String
    Default: "0.1.0"
    Description: "Core Bank Helm chart version to deploy"
    AllowedPattern: "^[a-zA-Z0-9.-]+$"
    ConstraintDescription: "Must be a valid version string"

  CoreBankReplicas:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: "Number of ledger service replicas"

  CoreBankNamespace:
    Type: String
    Default: "core-bank"
    Description: "Kubernetes namespace for all Core Bank components"
    AllowedPattern: "^[a-z][a-z0-9-]*$"
    ConstraintDescription: "Must be a valid Kubernetes namespace name"

  # =============================================================================
  # CONSOLE CONFIGURATION
  # =============================================================================
  NextAuthUrl:
    Type: String
    Default: ""
    Description: "Full public URL for the product console (e.g., https://console.example.com). Required for authentication to work correctly."
    AllowedPattern: "^$|^https?://.+$"
    ConstraintDescription: "Must be a valid URL starting with http:// or https://"

  # =============================================================================
  # INGRESS CONFIGURATION
  # =============================================================================
  EnableIngress:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable ALB Ingress for the product console external access"

  IngressHostname:
    Type: String
    Default: ""
    Description: "Full hostname for Console Ingress (e.g., console.example.com)"
    AllowedPattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?(\\.[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?)*$"
    ConstraintDescription: "Must be a valid hostname or empty"

  IngressScheme:
    Type: String
    Default: "internal"
    AllowedValues:
      - "internal"
      - "internet-facing"
    Description: "ALB scheme - internal (private) or internet-facing (public)"

  IngressCertificateArn:
    Type: String
    Default: ""
    Description: "ACM Certificate ARN for HTTPS (optional)"
    AllowedPattern: "^$|^arn:aws:acm:[a-z0-9-]+:[0-9]+:certificate/[a-f0-9-]+$"
    ConstraintDescription: "Must be a valid ACM certificate ARN or empty"

Conditions:
  HasIngress: !Equals [!Ref EnableIngress, "true"]
  HasCertificate: !Not [!Equals [!Ref IngressCertificateArn, ""]]

Resources:
  # =============================================================================
  # CORE BANK HELM DEPLOYMENT
  # =============================================================================
  CoreBankHelmStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}helm.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-ProjectName"
        EnvironmentName:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-EnvironmentName"
        ClusterName:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-EKSClusterName"
        VpcId:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-VpcId"
        PrivateSubnetIds:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-PrivateSubnetIds"
        # Database connections from infrastructure
        RDSEndpoint:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-RDSEndpoint"
        RDSSecretArn:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-RDSSecretArn"
        DocumentDBEndpoint:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-DocumentDBEndpoint"
        DocumentDBSecretArn:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-DocumentDBSecretArn"
        ElastiCacheEndpoint:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-ElastiCacheEndpoint"
        ElastiCacheSecretArn:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-ElastiCacheSecretArn"
        AmazonMQEndpoint:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-AmazonMQEndpoint"
        AmazonMQSecretArn:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-AmazonMQSecretArn"
        # KMS keys for secret decryption
        RDSKMSKeyArn:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-RDSKMSKeyArn"
        DocumentDBKMSKeyArn:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-DocumentDBKMSKeyArn"
        ElastiCacheKMSKeyArn:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-ElastiCacheKMSKeyArn"
        AmazonMQKMSKeyArn:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-AmazonMQKMSKeyArn"
        # Reporter object storage
        ReporterStorageBucketName:
          Fn::ImportValue: !Sub "${InfrastructureStackName}-ReporterStorageBucketName"
        # Core Bank configuration
        CoreBankChartVersion: !Ref CoreBankVersion
        CoreBankReplicas: !Ref CoreBankReplicas
        CoreBankNamespace: !Ref CoreBankNamespace
        # Console configuration
        NextAuthUrl: !Ref NextAuthUrl
        # Ingress
        EnableIngress: !Ref EnableIngress
        IngressHostname: !Ref IngressHostname
        IngressScheme: !Ref IngressScheme
        IngressCertificateArn: !Ref IngressCertificateArn
      Tags:
        - Key: Name
          Value: !Sub "core-bank-application-${InfrastructureStackName}"
        - Key: InfrastructureStack
          Value: !Ref InfrastructureStackName
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  ApplicationStackName:
    Description: Name of this application stack
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub "${AWS::StackName}-StackName"

  InfrastructureStackReference:
    Description: Infrastructure stack this application is deployed to
    Value: !Ref InfrastructureStackName

  CoreBankNamespace:
    Description: Kubernetes namespace where Core Bank is deployed
    Value: !GetAtt CoreBankHelmStack.Outputs.HelmNamespace
    Export:
      Name: !Sub "${AWS::StackName}-Namespace"

  ConsoleEndpoint:
    Description: Product Console endpoint
    Value: !GetAtt CoreBankHelmStack.Outputs.ConsoleEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-ConsoleEndpoint"

  UpdateCommand:
    Description: Command to update the Core Bank application
    Value: !Sub |
      aws cloudformation update-stack \
        --stack-name ${AWS::StackName} \
        --template-url https://${MPS3BucketName}.s3.${MPS3BucketRegion}.amazonaws.com/${MPS3KeyPrefix}application.yaml \
        --parameters ParameterKey=InfrastructureStackName,ParameterValue=${InfrastructureStackName} \
                     ParameterKey=CoreBankVersion,ParameterValue=NEW_VERSION \
        --capabilities CAPABILITY_IAM

  KubectlCommand:
    Description: Command to check Core Bank pods
    Value: !Sub |
      aws eks update-kubeconfig --name $(aws cloudformation describe-stacks --stack-name ${InfrastructureStackName} --query "Stacks[0].Outputs[?OutputKey=='EKSClusterName'].OutputValue" --output text) --region ${AWS::Region}
      kubectl get pods -n ${CoreBankNamespace}
