AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Plugin BR Pix Switch Infrastructure Stack
  Deploys RDS, DocumentDB, ElastiCache, AmazonMQ (RabbitMQ), and supporting services for the Plugin BR Pix Switch product.
  Provisions one dedicated RDS instance per service (SPI, DICT, COB) so each service owns its own
  database, plus a single ElastiCache cluster shared by all services.
  Can deploy standalone (creates VPC + EKS) or into an existing cluster (UseExistingCluster=true).

  PRODUCTION: resilience parameters default to low-cost values for evaluation, so
  a production stack must set RDSMultiAZ, RDSDeletionProtection and
  DocumentDBDeletionProtection to "true", AmazonMQDeploymentMode to
  CLUSTER_MULTI_AZ, and both backup retention periods to 30+ days.
  (c) Lerian Studio - https://lerian.studio

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "AWS Marketplace Configuration"
        Parameters:
          - MPS3BucketName
          - MPS3BucketRegion
          - MPS3KeyPrefix
      - Label:
          default: "General Configuration"
        Parameters:
          - EnvironmentName
          - ProjectName
      - Label:
          default: "Cluster Configuration"
        Parameters:
          - UseExistingCluster
          - ExistingClusterName
          - ExistingVpcId
          - ExistingPrivateSubnetIds
          - ExistingOIDCProviderArn
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcCIDR
          - AvailabilityZone1
          - AvailabilityZone2
          - AvailabilityZone3
          - EnableFlowLogs
          - FlowLogsRetentionDays
      - Label:
          default: "EKS Configuration"
        Parameters:
          - KubernetesVersion
          - NodeInstanceType
          - NodeGroupMinSize
          - NodeGroupMaxSize
          - NodeGroupDesiredSize
      - Label:
          default: "RDS PostgreSQL Configuration (shared by all three instances)"
        Parameters:
          - RDSEngineVersion
          - RDSInstanceClass
          - RDSAllocatedStorage
          - RDSMaxAllocatedStorage
          - RDSStorageType
          - RDSIops
          - CreateReadReplica
          - RDSForceSSL
          - RDSMultiAZ
          - RDSDeletionProtection
          - RDSBackupRetentionPeriod
      - Label:
          default: "RDS Per-Service Settings (one instance per service)"
        Parameters:
          - SpiRDSDatabaseName
          - SpiRDSMasterUsername
          - DictRDSDatabaseName
          - DictRDSMasterUsername
          - CobRDSDatabaseName
          - CobRDSMasterUsername
      - Label:
          default: "DocumentDB Configuration"
        Parameters:
          - DocumentDBInstanceClass
          - DocumentDBInstanceCount
          - DocumentDBMasterUsername
          - DocumentDBDeletionProtection
          - DocumentDBBackupRetentionPeriod
      - Label:
          default: "ElastiCache (Valkey/Redis) Configuration"
        Parameters:
          - ElastiCacheNodeType
      - Label:
          default: "AmazonMQ (RabbitMQ) Configuration"
        Parameters:
          - AmazonMQInstanceType
          - AmazonMQDeploymentMode
          - AmazonMQAdminUsername
      - Label:
          default: "Additional Network Access"
        Parameters:
          - AdditionalIngressCIDR1
          - AdditionalIngressCIDR2
          - AdditionalIngressCIDR3
      - Label:
          default: "DNS and Ingress Configuration"
        Parameters:
          - DomainName
          - EnableALBController
          - EnableExternalDNS
    ParameterLabels:
      # AWS Marketplace
      MPS3BucketName:
        default: "Template S3 Bucket Name"
      MPS3BucketRegion:
        default: "Template S3 Bucket Region"
      MPS3KeyPrefix:
        default: "Template S3 Key Prefix"
      # General
      EnvironmentName:
        default: "Environment"
      ProjectName:
        default: "Project Name"
      # Cluster
      UseExistingCluster:
        default: "Use Existing Cluster"
      ExistingClusterName:
        default: "Existing Cluster Name"
      ExistingVpcId:
        default: "Existing VPC ID"
      ExistingPrivateSubnetIds:
        default: "Existing Private Subnet IDs"
      ExistingOIDCProviderArn:
        default: "Existing OIDC Provider ARN"
      # Network
      VpcCIDR:
        default: "VPC CIDR Block"
      AvailabilityZone1:
        default: "Availability Zone 1"
      AvailabilityZone2:
        default: "Availability Zone 2"
      AvailabilityZone3:
        default: "Availability Zone 3"
      EnableFlowLogs:
        default: "Enable VPC Flow Logs"
      FlowLogsRetentionDays:
        default: "Flow Logs Retention (Days)"
      # EKS
      KubernetesVersion:
        default: "Kubernetes Version"
      NodeInstanceType:
        default: "Node Instance Type"
      NodeGroupMinSize:
        default: "Minimum Nodes"
      NodeGroupMaxSize:
        default: "Maximum Nodes"
      NodeGroupDesiredSize:
        default: "Desired Nodes"
      # RDS
      RDSEngineVersion:
        default: "PostgreSQL Engine Version"
      RDSInstanceClass:
        default: "RDS Instance Class"
      RDSAllocatedStorage:
        default: "Initial Storage (GB)"
      RDSMaxAllocatedStorage:
        default: "Maximum Storage (GB)"
      RDSStorageType:
        default: "Storage Type"
      RDSIops:
        default: "Provisioned IOPS"
      SpiRDSDatabaseName:
        default: "SPI Database Name"
      SpiRDSMasterUsername:
        default: "SPI Master Username"
      DictRDSDatabaseName:
        default: "DICT Database Name"
      DictRDSMasterUsername:
        default: "DICT Master Username"
      CobRDSDatabaseName:
        default: "COB Database Name"
      CobRDSMasterUsername:
        default: "COB Master Username"
      CreateReadReplica:
        default: "Create Read Replica"
      RDSForceSSL:
        default: "Force SSL Connections"
      RDSMultiAZ:
        default: "Multi-AZ Deployment"
      RDSDeletionProtection:
        default: "Deletion Protection"
      RDSBackupRetentionPeriod:
        default: "Backup Retention (Days)"
      # DocumentDB
      DocumentDBInstanceClass:
        default: "DocumentDB Instance Class"
      DocumentDBInstanceCount:
        default: "Number of Instances"
      DocumentDBMasterUsername:
        default: "Master Username"
      DocumentDBDeletionProtection:
        default: "Deletion Protection"
      DocumentDBBackupRetentionPeriod:
        default: "Backup Retention (Days)"
      # ElastiCache
      ElastiCacheNodeType:
        default: "Cache Node Type"
      # AmazonMQ
      AmazonMQInstanceType:
        default: "Broker Instance Type"
      AmazonMQDeploymentMode:
        default: "Deployment Mode"
      AmazonMQAdminUsername:
        default: "Admin Username"
      # Additional Network Access
      AdditionalIngressCIDR1:
        default: "Additional CIDR 1"
      AdditionalIngressCIDR2:
        default: "Additional CIDR 2"
      AdditionalIngressCIDR3:
        default: "Additional CIDR 3"
      # DNS
      DomainName:
        default: "Domain Name (Optional)"
      EnableALBController:
        default: "Enable ALB Controller"
      EnableExternalDNS:
        default: "Enable ExternalDNS"

Parameters:
  # =============================================================================
  # AWS MARKETPLACE PARAMETERS (Required for Nested Stacks)
  # =============================================================================
  MPS3BucketName:
    Type: String
    Description: "S3 bucket name containing the CloudFormation templates (managed by AWS Marketplace)"
    Default: "lerian-cloudformation-foundation"

  MPS3BucketRegion:
    Type: String
    Description: "AWS Region where the S3 bucket is located (fixed to sa-east-1)"
    Default: "sa-east-1"
    AllowedValues:
      - sa-east-1

  MPS3KeyPrefix:
    Type: String
    Description: "S3 key prefix for the CloudFormation templates"
    Default: "releases/latest/"
    AllowedPattern: "^[a-zA-Z0-9-_./]*$"
    ConstraintDescription: "Key prefix can include alphanumeric characters, hyphens, underscores, periods, and forward slashes"

  # =============================================================================
  # GENERAL CONFIGURATION
  # =============================================================================
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name for resource tagging

  ProjectName:
    Type: String
    Default: plugin-br-pix-switch
    Description: |
      Project name used for resource naming.
      Capped at 40 characters (not the usual 128) because nested stacks append
      suffixes to this value and several AWS identifiers are short. The binding
      limits, measured across every physical name this stack generates:
        40  alb-controller.yaml  FunctionName "<name>-alb-controller-deployer" (max 64)
        40  documentdb.yaml      DBInstanceIdentifier "<name>-documentdb-instance-10" (max 63)
        41  amazonmq.yaml        BrokerName "<name>-rabbitmq" (max 50)
        42  external-dns.yaml    FunctionName "<name>-external-dns-deployer" (max 64)
        46  rds.yaml             DBInstanceIdentifier "<name>-dict-rds-replica" (max 63)
      Exceeding 40 passes template validation and then fails mid-deploy inside
      the nested stack, so the cap is enforced here instead. Note that a
      deployment platform may prefix this value with its own environment id,
      which counts against the 40.
    # Hyphens must separate alphanumeric groups: RDS rejects a
    # DBInstanceIdentifier with consecutive or trailing hyphens, and this value
    # is the prefix of one. The looser "^[a-zA-Z][a-zA-Z0-9-]*$" used elsewhere
    # would accept "my-name-" or "my--name" and only fail at deploy time.
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9]*(-[a-zA-Z0-9]+)*$"
    MinLength: 3
    MaxLength: 40
    ConstraintDescription: "Must begin with a letter, contain only letters, numbers, and single separating hyphens (no consecutive or trailing hyphens), and be 3-40 characters long (40 is set by the longest names generated from this value: the ALB Controller deployer Lambda FunctionName and the DocumentDB instance identifiers)"

  # =============================================================================
  # CLUSTER CONFIGURATION
  # =============================================================================
  UseExistingCluster:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: |
      Set to true to deploy services into an existing VPC and EKS cluster
      (e.g., when deploying a second product to a shared cluster).
      When true, ExistingClusterName, ExistingVpcId and ExistingPrivateSubnetIds are required.

  ExistingClusterName:
    Type: String
    Default: ""
    Description: "Name of the existing EKS cluster (required when UseExistingCluster=true)"

  ExistingVpcId:
    Type: String
    Default: ""
    Description: "VPC ID where services will be deployed (required when UseExistingCluster=true)"

  ExistingPrivateSubnetIds:
    Type: String
    Default: ""
    Description: "Comma-separated list of private subnet IDs (required when UseExistingCluster=true)"

  ExistingOIDCProviderArn:
    Type: String
    Default: ""
    Description: "OIDC Provider ARN of the existing EKS cluster (required when EnableALBController=true or EnableExternalDNS=true with UseExistingCluster=true)"

  # Network
  VpcCIDR:
    Type: String
    Default: 10.50.0.0/16
    Description: CIDR block for the VPC
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$

  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: First Availability Zone

  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Second Availability Zone

  AvailabilityZone3:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Third Availability Zone

  EnableFlowLogs:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
    Description: Enable VPC Flow Logs for network traffic auditing and security analysis.

  FlowLogsRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653
    Description: Number of days to retain VPC Flow Logs in CloudWatch.

  # EKS
  KubernetesVersion:
    Type: String
    Default: "1.35"
    AllowedValues:
      - "1.35"
      - "1.34"
      - "1.33"
    Description: Kubernetes version for EKS cluster

  NodeInstanceType:
    Type: String
    Default: c7g.large
    AllowedValues:
      - c7g.medium
      - c7g.large
      - c7g.xlarge
      - c7g.2xlarge
      - m7g.medium
      - m7g.large
      - m7g.xlarge
      - m7g.2xlarge
      - r7g.medium
      - r7g.large
      - r7g.xlarge
      - c6g.medium
      - c6g.large
      - c6g.xlarge
      - c6g.2xlarge
      - m6g.medium
      - m6g.large
      - m6g.xlarge
    Description: EC2 instance type for EKS worker nodes (ARM64 Graviton)

  NodeGroupMinSize:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 100
    Description: Minimum number of worker nodes

  NodeGroupMaxSize:
    Type: Number
    Default: 15
    MinValue: 1
    MaxValue: 100
    Description: Maximum number of worker nodes

  NodeGroupDesiredSize:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 100
    Description: Desired number of worker nodes

  # RDS
  RDSEngineVersion:
    Type: String
    Default: "16.14"
    Description: |
      PostgreSQL major.minor.patch — must be available on RDS in the
      deploy region. AWS deprecates patch versions periodically;
      verify with `aws rds describe-db-engine-versions --engine
      postgres` before bumping. Pinned default here keeps new stacks
      on a known-good version rather than inheriting whatever
      templates/rds.yaml carries.

  RDSInstanceClass:
    Type: String
    Default: db.t3.medium
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium
      - db.t3.large
      - db.m7g.large
      - db.m7g.xlarge
      - db.r7g.large
      - db.r7g.xlarge
      - db.r7g.2xlarge
      - db.r7g.4xlarge
      - db.r7g.8xlarge
      - db.r7g.12xlarge
      - db.r7g.16xlarge
    Description: RDS instance class

  RDSAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 65536
    Description: Initial storage allocation in GB

  RDSMaxAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 65536
    Description: Maximum storage for autoscaling in GB

  RDSStorageType:
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - io1
      - io2
    Description: Storage type for RDS instance

  RDSIops:
    Type: Number
    Default: 3000
    MinValue: 3000
    MaxValue: 64000
    Description: |
      Provisioned IOPS for RDS storage, applied to all three instances.
      ONLY TAKES EFFECT WHEN RDSStorageType IS io1 OR io2: templates/rds.yaml
      resolves Iops to AWS::NoValue for any other storage type, so with the
      default gp3 this parameter is ignored entirely and the volume runs on the
      gp3 baseline that RDS derives from the allocated storage size (3000 IOPS at
      the default 20 GiB). Set RDSStorageType to io1/io2 first if you need to
      provision IOPS explicitly.
      This parameter is capped at 64000 by MaxValue above; that is a cap imposed
      here, not an AWS service maximum. The IOPS an instance can actually deliver
      also depends on the allocated storage size and the instance class, so a
      value accepted at validation time may still be rejected or unused by RDS.

  # Each service gets its own RDS instance, so each carries its own initial
  # database name. Underscores only — RDS DBName rejects hyphens, which is why
  # these are pix_spi/pix_dict/pix_cob rather than the chart's pix-spi style
  # names. Set global.externalPostgresDefinitions.enabled=false in the Helm
  # values when using these instances: the databases already exist here, so the
  # chart's bootstrap Jobs have nothing to create.
  SpiRDSDatabaseName:
    Type: String
    Default: pix_spi
    Description: Name of the initial database on the SPI RDS instance (used by spi and spi-systemplane)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 64
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  DictRDSDatabaseName:
    Type: String
    Default: pix_dict
    Description: Name of the initial database on the DICT RDS instance (used by dict-hub, dict-hub-vsync and dict-systemplane)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 64
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  CobRDSDatabaseName:
    Type: String
    Default: pix_cob
    Description: Name of the initial database on the COB RDS instance (used by cob-hub and cob-systemplane)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 64
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  # One master username per RDS instance, so a credential leaked from one
  # service does not authenticate against the other two. Each instance already
  # gets its own generated password in its own Secrets Manager entry
  # (<ProjectName>-{spi,dict,cob}/rds-master-password); these parameters extend
  # that isolation to the username. The three values may be identical if an
  # operator prefers, but distinct usernames are recommended.
  SpiRDSMasterUsername:
    Type: String
    NoEcho: true
    Description: Master username for the SPI RDS instance (required, no default for security)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 63
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  DictRDSMasterUsername:
    Type: String
    NoEcho: true
    Description: Master username for the DICT RDS instance (required, no default for security)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 63
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  CobRDSMasterUsername:
    Type: String
    NoEcho: true
    Description: Master username for the COB RDS instance (required, no default for security)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 63
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  CreateReadReplica:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create a read replica for RDS

  RDSForceSSL:
    Type: String
    Default: "1"
    AllowedValues:
      - "0"
      - "1"
    Description: |
      Force SSL/TLS connections to RDS (1 = enabled, 0 = disabled), applied as
      rds.force_ssl on all three instances.
      Defaults to "1" here — these databases hold PIX payment data, so cleartext
      connections should be an explicit opt-out rather than the default. This
      matches the default of templates/rds.yaml itself; other products override
      it to "0". Clients must connect with sslmode=require or higher (the Helm
      DATABASE_URL values already use sslmode=require for managed Postgres).

  RDSMultiAZ:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable Multi-AZ deployment for high availability. Recommended for production workloads.

  RDSDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable deletion protection to prevent accidental database deletion.

  RDSBackupRetentionPeriod:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Number of days to retain automated backups (1-35). Recommended 30+ for production.

  # DocumentDB
  DocumentDBInstanceClass:
    Type: String
    Default: db.t3.medium
    AllowedValues:
      - db.t3.medium
      - db.r6g.large
      - db.r6g.xlarge
      - db.r6g.2xlarge
      - db.r6g.4xlarge
      - db.r6g.8xlarge
      - db.r6g.12xlarge
    Description: DocumentDB instance class

  DocumentDBInstanceCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: Number of DocumentDB instances

  DocumentDBMasterUsername:
    Type: String
    NoEcho: true
    Description: Master username for DocumentDB (required, no default for security)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 63
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  DocumentDBDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable deletion protection to prevent accidental cluster deletion.

  DocumentDBBackupRetentionPeriod:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Number of days to retain automated backups (1-35). Recommended 30+ for production.

  # ElastiCache — a single cluster shared by all services. Consumed by spi,
  # dict-hub and dict-hub-vsync for VALKEY_URL; each component addresses its own
  # logical Valkey database on this shared endpoint.
  ElastiCacheNodeType:
    Type: String
    Default: cache.m7g.large
    AllowedValues:
      - cache.t3.micro
      - cache.t3.small
      - cache.t3.medium
      - cache.m7g.large
      - cache.m7g.xlarge
      - cache.r7g.large
      - cache.r7g.xlarge
    Description: |
      ElastiCache node type for the shared Valkey cluster.
      COST NOTE: templates/elasticache.yaml hardcodes NumCacheClusters=2 with
      AutomaticFailover and MultiAZ enabled, so this cluster is always TWO nodes
      of the chosen type — there is no single-node option. Billing is 2x the
      node price. cache.t3.micro is the cheapest option and still supports the
      in-transit/at-rest encryption the template requires.

  # AmazonMQ
  AmazonMQInstanceType:
    Type: String
    Default: mq.t3.micro
    AllowedValues:
      - mq.t3.micro
      - mq.m5.large
      - mq.m5.xlarge
      - mq.m5.2xlarge
      - mq.m5.4xlarge
      - mq.m7g.large
      - mq.m7g.xlarge
      - mq.m7g.2xlarge
      - mq.m7g.4xlarge
      - mq.m7g.8xlarge
      - mq.m7g.12xlarge
      - mq.m7g.16xlarge
    Description: AmazonMQ broker instance type

  AmazonMQDeploymentMode:
    Type: String
    Default: SINGLE_INSTANCE
    AllowedValues:
      - SINGLE_INSTANCE
      - CLUSTER_MULTI_AZ
    Description: Broker deployment mode. CLUSTER_MULTI_AZ deploys 3 nodes across AZs for HA.

  AmazonMQAdminUsername:
    Type: String
    NoEcho: true
    Description: Admin username for AmazonMQ (required, no default for security)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  # =============================================================================
  # ADDITIONAL NETWORK ACCESS
  # =============================================================================
  AdditionalIngressCIDR1:
    Type: String
    Default: ""
    Description: "Additional CIDR block for resource access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

  AdditionalIngressCIDR2:
    Type: String
    Default: ""
    Description: "Additional CIDR block for resource access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

  AdditionalIngressCIDR3:
    Type: String
    Default: ""
    Description: "Additional CIDR block for resource access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

  # =============================================================================
  # DNS AND INGRESS CONFIGURATION
  # =============================================================================
  DomainName:
    Type: String
    Default: ""
    Description: Domain name for Route53 private hosted zone (e.g., midaz.empresa.com). Leave empty to skip DNS setup.
    AllowedPattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?(\\.[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?)*$"
    ConstraintDescription: "Must be a valid domain name (e.g., example.com or sub.example.com) or empty"

  EnableALBController:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable AWS Load Balancer Controller for Ingress

  EnableExternalDNS:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable ExternalDNS for automatic DNS management (requires DomainName)

Rules:
  # The parameter descriptions state which values UseExistingCluster=true
  # requires, but nothing enforced them: leaving one empty still started the
  # deployment and then failed inside a nested stack with an error that never
  # named the missing parameter. These assertions reject the request at
  # template-validation time instead.
  ExistingClusterRequiresClusterName:
    RuleCondition: !Equals [!Ref UseExistingCluster, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingClusterName, ""]]
        AssertDescription: "ExistingClusterName is required when UseExistingCluster is 'true'."

  ExistingClusterRequiresVpcId:
    RuleCondition: !Equals [!Ref UseExistingCluster, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingVpcId, ""]]
        AssertDescription: "ExistingVpcId is required when UseExistingCluster is 'true'."

  ExistingClusterRequiresPrivateSubnetIds:
    RuleCondition: !Equals [!Ref UseExistingCluster, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingPrivateSubnetIds, ""]]
        AssertDescription: "ExistingPrivateSubnetIds is required when UseExistingCluster is 'true'."

  # ALB controller and ExternalDNS both create IRSA roles, which need the OIDC
  # provider of the target cluster. In standalone mode it comes from EKSStack;
  # against an existing cluster the operator must supply it.
  ExistingClusterRequiresOIDCForIRSA:
    RuleCondition: !And
      - !Equals [!Ref UseExistingCluster, "true"]
      - !Or
        - !Equals [!Ref EnableALBController, "true"]
        - !Equals [!Ref EnableExternalDNS, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingOIDCProviderArn, ""]]
        AssertDescription: "ExistingOIDCProviderArn is required when UseExistingCluster is 'true' and EnableALBController or EnableExternalDNS is 'true'."

Conditions:
  CreateNewCluster: !Equals [!Ref UseExistingCluster, "false"]
  CreateRDSReplica: !Equals [!Ref CreateReadReplica, "true"]
  HasDomainName: !Not [!Equals [!Ref DomainName, ""]]
  ShouldEnableALBController: !Equals [!Ref EnableALBController, "true"]
  ShouldEnableExternalDNS: !And
    - !Condition HasDomainName
    - !Equals [!Ref EnableExternalDNS, "true"]

Resources:
  # =============================================================================
  # VPC STACK
  # =============================================================================
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewCluster
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}vpc.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        VpcCIDR: !Ref VpcCIDR
        AvailabilityZone1: !Ref AvailabilityZone1
        AvailabilityZone2: !Ref AvailabilityZone2
        AvailabilityZone3: !Ref AvailabilityZone3
        EnableFlowLogs: !Ref EnableFlowLogs
        FlowLogsRetentionDays: !Ref FlowLogsRetentionDays
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # RDS STACKS — one dedicated PostgreSQL instance per service
  #
  # Postgres is consumed by 7 of the 9 chart components, grouped by service:
  #   SPI    spi, spi-systemplane
  #   DICT   dict-hub, dict-hub-vsync, dict-systemplane
  #   COB    cob-hub, cob-systemplane
  #
  # Every named resource inside templates/rds.yaml is derived from ProjectName
  # (DB identifier, security group, subnet group, parameter group, KMS alias and
  # the Secrets Manager secret path). Each stack therefore receives a distinct
  # per-service ProjectName so the three instances coexist in the same VPC
  # without name collisions. Sizing parameters are shared across the three.
  # =============================================================================
  SpiRDSStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}rds.yaml"
      Parameters:
        ProjectName: !Sub "${ProjectName}-spi"
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        VpcCIDR: !Ref VpcCIDR
        DatabaseSubnetIds: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.DatabaseSubnetIds, !Ref ExistingPrivateSubnetIds]
        EngineVersion: !Ref RDSEngineVersion
        InstanceClass: !Ref RDSInstanceClass
        AllocatedStorage: !Ref RDSAllocatedStorage
        MaxAllocatedStorage: !Ref RDSMaxAllocatedStorage
        StorageType: !Ref RDSStorageType
        Iops: !Ref RDSIops
        DatabaseName: !Ref SpiRDSDatabaseName
        MasterUsername: !Ref SpiRDSMasterUsername
        CreateReadReplica: !Ref CreateReadReplica
        ForceSSL: !Ref RDSForceSSL
        MultiAZ: !Ref RDSMultiAZ
        DeletionProtection: !Ref RDSDeletionProtection
        BackupRetentionPeriod: !Ref RDSBackupRetentionPeriod
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-spi-rds-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: spi
        - Key: ManagedBy
          Value: CloudFormation

  DictRDSStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}rds.yaml"
      Parameters:
        ProjectName: !Sub "${ProjectName}-dict"
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        VpcCIDR: !Ref VpcCIDR
        DatabaseSubnetIds: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.DatabaseSubnetIds, !Ref ExistingPrivateSubnetIds]
        EngineVersion: !Ref RDSEngineVersion
        InstanceClass: !Ref RDSInstanceClass
        AllocatedStorage: !Ref RDSAllocatedStorage
        MaxAllocatedStorage: !Ref RDSMaxAllocatedStorage
        StorageType: !Ref RDSStorageType
        Iops: !Ref RDSIops
        DatabaseName: !Ref DictRDSDatabaseName
        MasterUsername: !Ref DictRDSMasterUsername
        CreateReadReplica: !Ref CreateReadReplica
        ForceSSL: !Ref RDSForceSSL
        MultiAZ: !Ref RDSMultiAZ
        DeletionProtection: !Ref RDSDeletionProtection
        BackupRetentionPeriod: !Ref RDSBackupRetentionPeriod
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-dict-rds-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: dict
        - Key: ManagedBy
          Value: CloudFormation

  CobRDSStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}rds.yaml"
      Parameters:
        ProjectName: !Sub "${ProjectName}-cob"
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        VpcCIDR: !Ref VpcCIDR
        DatabaseSubnetIds: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.DatabaseSubnetIds, !Ref ExistingPrivateSubnetIds]
        EngineVersion: !Ref RDSEngineVersion
        InstanceClass: !Ref RDSInstanceClass
        AllocatedStorage: !Ref RDSAllocatedStorage
        MaxAllocatedStorage: !Ref RDSMaxAllocatedStorage
        StorageType: !Ref RDSStorageType
        Iops: !Ref RDSIops
        DatabaseName: !Ref CobRDSDatabaseName
        MasterUsername: !Ref CobRDSMasterUsername
        CreateReadReplica: !Ref CreateReadReplica
        ForceSSL: !Ref RDSForceSSL
        MultiAZ: !Ref RDSMultiAZ
        DeletionProtection: !Ref RDSDeletionProtection
        BackupRetentionPeriod: !Ref RDSBackupRetentionPeriod
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cob-rds-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: cob
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # DOCUMENTDB STACK
  # Used by dict-hub only (MONGO_URL, database pix-dict)
  # =============================================================================
  DocumentDBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}documentdb.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        VpcCIDR: !Ref VpcCIDR
        PrivateSubnetIds: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.PrivateSubnetIds, !Ref ExistingPrivateSubnetIds]
        InstanceClass: !Ref DocumentDBInstanceClass
        InstanceCount: !Ref DocumentDBInstanceCount
        MasterUsername: !Ref DocumentDBMasterUsername
        DeletionProtection: !Ref DocumentDBDeletionProtection
        BackupRetentionPeriod: !Ref DocumentDBBackupRetentionPeriod
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-documentdb-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # ELASTICACHE STACK — a single Valkey cluster shared by all services
  #
  # Consumed by spi, dict-hub and dict-hub-vsync for VALKEY_URL. Unlike RDS,
  # the cache is shared: it holds ephemeral data only, so a single cluster is
  # sufficient and each component addresses its own logical Valkey database on
  # the shared endpoint.
  #
  # This stack keeps the unsuffixed ProjectName — there are no sibling cache
  # stacks to collide with over the ProjectName-derived resource names.
  # =============================================================================
  ElastiCacheStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}elasticache.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        VpcCIDR: !Ref VpcCIDR
        CacheSubnetIds: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.DatabaseSubnetIds, !Ref ExistingPrivateSubnetIds]
        NodeType: !Ref ElastiCacheNodeType
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-elasticache-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # AMAZONMQ STACK (RabbitMQ)
  # Used by dict-hub-vsync only (RABBITMQ_URI). The broker exposes an AMQPS
  # endpoint on 5671, which is what the vsync consumer requires.
  # =============================================================================
  AmazonMQStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}amazonmq.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        VpcCIDR: !Ref VpcCIDR
        PrivateSubnetIds: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.PrivateSubnetIds, !Ref ExistingPrivateSubnetIds]
        InstanceType: !Ref AmazonMQInstanceType
        DeploymentMode: !Ref AmazonMQDeploymentMode
        AdminUsername: !Ref AmazonMQAdminUsername
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-amazonmq-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # EKS STACK
  # =============================================================================
  EKSStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewCluster
    DependsOn:
      - SpiRDSStack
      - DictRDSStack
      - CobRDSStack
      - DocumentDBStack
      - ElastiCacheStack
      - AmazonMQStack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}eks.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt VPCStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt VPCStack.Outputs.PrivateSubnetIds
        KubernetesVersion: !Ref KubernetesVersion
        NodeInstanceType: !Ref NodeInstanceType
        NodeGroupMinSize: !Ref NodeGroupMinSize
        NodeGroupMaxSize: !Ref NodeGroupMaxSize
        NodeGroupDesiredSize: !Ref NodeGroupDesiredSize
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-eks-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # ROUTE53 STACK (Private Hosted Zone)
  # =============================================================================
  Route53Stack:
    Type: AWS::CloudFormation::Stack
    Condition: HasDomainName
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}route53.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        DomainName: !Ref DomainName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-route53-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # ALB CONTROLLER STACK
  # =============================================================================
  ALBControllerStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldEnableALBController
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}alb-controller.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        ClusterName: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.ClusterName, !Ref ExistingClusterName]
        OIDCProviderArn: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.OIDCProviderArn, !Ref ExistingOIDCProviderArn]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-controller-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # EXTERNAL DNS STACK
  # =============================================================================
  ExternalDNSStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldEnableExternalDNS
    DependsOn: Route53Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}external-dns.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        ClusterName: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.ClusterName, !Ref ExistingClusterName]
        OIDCProviderArn: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.OIDCProviderArn, !Ref ExistingOIDCProviderArn]
        PrivateHostedZoneId: !GetAtt Route53Stack.Outputs.PrivateHostedZoneId
        DomainName: !Ref DomainName
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-external-dns-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  # =============================================================================
  # STACK METADATA (for application stack reference)
  # =============================================================================
  ProjectName:
    Description: Project name used in this deployment (stack name)
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub "${AWS::StackName}-ProjectName"

  EnvironmentName:
    Description: Environment name
    Value: !Ref EnvironmentName
    Export:
      Name: !Sub "${AWS::StackName}-EnvironmentName"

  # =============================================================================
  # VPC OUTPUTS
  # =============================================================================
  VpcId:
    Description: VPC ID
    Value: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  PrivateSubnetIds:
    Description: Private Subnet IDs
    Value: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.PrivateSubnetIds, !Ref ExistingPrivateSubnetIds]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"

  # =============================================================================
  # EKS OUTPUTS
  # =============================================================================
  EKSClusterName:
    Description: EKS Cluster Name
    Value: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.ClusterName, !Ref ExistingClusterName]
    Export:
      Name: !Sub "${AWS::StackName}-EKSClusterName"

  EKSClusterEndpoint:
    Condition: CreateNewCluster
    Description: EKS Cluster Endpoint
    Value: !GetAtt EKSStack.Outputs.ClusterEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-EKSClusterEndpoint"

  OIDCProviderArn:
    Description: EKS OIDC Provider ARN
    Value: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.OIDCProviderArn, !Ref ExistingOIDCProviderArn]
    Export:
      Name: !Sub "${AWS::StackName}-OIDCProviderArn"

  ClusterSecurityGroupId:
    Condition: CreateNewCluster
    Description: EKS Cluster Security Group ID
    Value: !GetAtt EKSStack.Outputs.ClusterSecurityGroupId
    Export:
      Name: !Sub "${AWS::StackName}-ClusterSecurityGroupId"

  # =============================================================================
  # RDS OUTPUTS (one instance per service)
  # =============================================================================
  SpiRDSEndpoint:
    Description: SPI RDS Primary Endpoint (spi, spi-systemplane)
    Value: !GetAtt SpiRDSStack.Outputs.Endpoint
    Export:
      Name: !Sub "${AWS::StackName}-SpiRDSEndpoint"

  SpiRDSSecretArn:
    Description: SPI RDS Password Secret ARN
    Value: !GetAtt SpiRDSStack.Outputs.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-SpiRDSSecretArn"

  DictRDSEndpoint:
    Description: DICT RDS Primary Endpoint (dict-hub, dict-hub-vsync, dict-systemplane)
    Value: !GetAtt DictRDSStack.Outputs.Endpoint
    Export:
      Name: !Sub "${AWS::StackName}-DictRDSEndpoint"

  DictRDSSecretArn:
    Description: DICT RDS Password Secret ARN
    Value: !GetAtt DictRDSStack.Outputs.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-DictRDSSecretArn"

  CobRDSEndpoint:
    Description: COB RDS Primary Endpoint (cob-hub, cob-systemplane)
    Value: !GetAtt CobRDSStack.Outputs.Endpoint
    Export:
      Name: !Sub "${AWS::StackName}-CobRDSEndpoint"

  CobRDSSecretArn:
    Description: COB RDS Password Secret ARN
    Value: !GetAtt CobRDSStack.Outputs.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-CobRDSSecretArn"

  # Database names are exported so consumers (the Helm values, or an application
  # stack) can build DATABASE_URL without hard-coding them.
  SpiRDSDatabaseName:
    Description: SPI database name
    Value: !Ref SpiRDSDatabaseName
    Export:
      Name: !Sub "${AWS::StackName}-SpiRDSDatabaseName"

  DictRDSDatabaseName:
    Description: DICT database name
    Value: !Ref DictRDSDatabaseName
    Export:
      Name: !Sub "${AWS::StackName}-DictRDSDatabaseName"

  CobRDSDatabaseName:
    Description: COB database name
    Value: !Ref CobRDSDatabaseName
    Export:
      Name: !Sub "${AWS::StackName}-CobRDSDatabaseName"

  # =============================================================================
  # DOCUMENTDB OUTPUTS
  # =============================================================================
  DocumentDBEndpoint:
    Description: DocumentDB Cluster Endpoint
    Value: !GetAtt DocumentDBStack.Outputs.ClusterEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-DocumentDBEndpoint"

  DocumentDBSecretArn:
    Description: DocumentDB Password Secret ARN
    Value: !GetAtt DocumentDBStack.Outputs.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-DocumentDBSecretArn"

  # =============================================================================
  # ELASTICACHE OUTPUTS (single shared cluster)
  # =============================================================================
  ElastiCacheEndpoint:
    Description: ElastiCache Primary Endpoint (shared by spi, dict-hub and dict-hub-vsync)
    Value: !GetAtt ElastiCacheStack.Outputs.PrimaryEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-ElastiCacheEndpoint"

  ElastiCacheAuthSecretArn:
    Description: ElastiCache Auth Token Secret ARN
    Value: !GetAtt ElastiCacheStack.Outputs.AuthSecretArn
    Export:
      Name: !Sub "${AWS::StackName}-ElastiCacheAuthSecretArn"

  # =============================================================================
  # AMAZONMQ OUTPUTS
  # =============================================================================
  AmazonMQEndpoint:
    Description: AmazonMQ Broker Endpoint (AMQPS)
    Value: !GetAtt AmazonMQStack.Outputs.BrokerEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-AmazonMQEndpoint"

  AmazonMQSecretArn:
    Description: AmazonMQ Password Secret ARN
    Value: !GetAtt AmazonMQStack.Outputs.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-AmazonMQSecretArn"

  # =============================================================================
  # ROUTE53 OUTPUTS
  # =============================================================================
  PrivateHostedZoneId:
    Condition: HasDomainName
    Description: Route53 Private Hosted Zone ID
    Value: !GetAtt Route53Stack.Outputs.PrivateHostedZoneId
    Export:
      Name: !Sub "${AWS::StackName}-PrivateHostedZoneId"

  PrivateHostedZoneName:
    Condition: HasDomainName
    Description: Route53 Private Hosted Zone Name
    Value: !GetAtt Route53Stack.Outputs.PrivateHostedZoneName
    Export:
      Name: !Sub "${AWS::StackName}-PrivateHostedZoneName"

  # =============================================================================
  # ALB CONTROLLER OUTPUTS
  # =============================================================================
  ALBControllerRoleArn:
    Condition: ShouldEnableALBController
    Description: ALB Controller IAM Role ARN
    Value: !GetAtt ALBControllerStack.Outputs.ALBControllerRoleArn
    Export:
      Name: !Sub "${AWS::StackName}-ALBControllerRoleArn"

  # =============================================================================
  # EXTERNAL DNS OUTPUTS
  # =============================================================================
  ExternalDNSRoleArn:
    Condition: ShouldEnableExternalDNS
    Description: ExternalDNS IAM Role ARN
    Value: !GetAtt ExternalDNSStack.Outputs.ExternalDNSRoleArn
    Export:
      Name: !Sub "${AWS::StackName}-ExternalDNSRoleArn"

  # =============================================================================
  # UTILITY COMMANDS
  # =============================================================================
  KubeconfigCommand:
    Description: Command to configure kubectl
    Value: !Sub
      - "aws eks update-kubeconfig --name ${ClusterName} --region ${AWS::Region}"
      - ClusterName: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.ClusterName, !Ref ExistingClusterName]
