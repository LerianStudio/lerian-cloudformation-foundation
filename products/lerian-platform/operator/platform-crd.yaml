apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platforms.platform.lerian.io
spec:
  group: platform.lerian.io
  scope: Namespaced
  names:
    kind: Platform
    plural: platforms
    singular: platform
    shortNames: [lplat]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                topology:
                  type: string
                  enum: [shared, dedicated]
                  default: shared
                # Cloud-agnostic infra handoff. Endpoints are plain host strings;
                # credentials come from K8s Secrets (populated by ANY provisioner:
                # CloudFormation on AWS, Terraform/Crossplane elsewhere). No cloud SDK.
                environmentContract:
                  type: object
                  properties:
                    postgres:
                      type: object
                      properties:
                        host: { type: string }
                        port: { type: string, default: "5432" }
                        secretRef: { type: string }   # keys: username, password
                    mongo:
                      type: object
                      properties:
                        host: { type: string }
                        port: { type: string, default: "27017" }
                        secretRef: { type: string }
                        params: { type: string }
                    redis:
                      type: object
                      properties:
                        host: { type: string }
                        port: { type: string, default: "6379" }
                        secretRef: { type: string }
                        caCertB64: { type: string }
                    amqp:
                      type: object
                      properties:
                        host: { type: string }
                        secretRef: { type: string }
                    kafka:
                      type: object
                      properties:
                        brokers: { type: string }
                        secretRef: { type: string }
                        mechanism: { type: string, default: "SCRAM-SHA-512" }
                    objectStorage:
                      type: object
                      properties:
                        region: { type: string }
                        # auth.type: irsa (AWS) | workloadIdentity (GCP) | staticKey
                        auth:
                          type: object
                          properties:
                            type: { type: string }
                            roleArn: { type: string }   # AWS IRSA
                authorizer:
                  type: object
                  properties:
                    clientId: { type: string }
                    clientSecret: { type: string }
                    organizationIds: { type: string }
                modules:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      version: { type: string }
                      bucket: { type: string }
                      licenseSecretRef: { type: string }  # key: LICENSE_KEY
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Topology
          type: string
          jsonPath: .spec.topology
        - name: Phase
          type: string
          jsonPath: .status.phase
