AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Lerian Platform - One-Click Full Stack (dev-scoped v0)
  Deploys VPC, EKS, RDS, DocumentDB, ElastiCache, and AmazonMQ, then installs
  the platform-orchestrator Kubernetes controller and hands off module
  lifecycle to it — all from a single stack, single click. Nests
  templates/foundation.yaml (VPC+EKS) and products/midaz/infrastructure.yaml
  (RDS/DocumentDB/ElastiCache/AmazonMQ — same infra shape Lerian Platform
  needs) as AWS::CloudFormation::Stack resources, then nests this product's
  own orchestrator.yaml as the Application layer, wiring every endpoint/
  secret-ARN/cluster-name parameter it would otherwise require by hand via
  !GetAtt from the two infra layers. See CHECKPOINT.md for the full set of
  known v0 caveats this template inherits from orchestrator.yaml (sa-east-1
  only, shared dev AuthorizerClientSecret, fees/pix_indirect_btg unsupported).
  (c) Lerian Studio - https://lerian.studio

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      # MPS3BucketName/MPS3BucketRegion/MPS3KeyPrefix/MPS3ProductKeyPrefix are
      # deliberately NOT in a ParameterGroup here — they're internal plumbing
      # (which S3 bucket OUR OWN nested templates live in), never something a
      # customer should need to touch. A raw CFN template has no native
      # "hide this parameter" flag; leaving them ungrouped is the closest a
      # template alone can get (Console renders them in a generic, unlabeled
      # area instead of a nice named section). They stay real Parameters
      # (not hardcoded literals) so internal/dev testing can still point them
      # at a scratch bucket. True hiding for the real customer-facing
      # Marketplace listing happens in the AWS Marketplace Management
      # Portal's own fulfillment/parameter-lock configuration for this
      # product, not in this template.
      - Label:
          default: "General Configuration"
        Parameters:
          - ProjectName
          - EnvironmentName
          - PermissionsBoundaryArn
      - Label:
          default: "Network (Foundation)"
        Parameters:
          - VpcCIDR
          - AvailabilityZone1
          - AvailabilityZone2
          - AvailabilityZone3
          - EnableFlowLogs
          - FlowLogsRetentionDays
          - KubernetesVersion
          - NodeInstanceType
          - NodeGroupMinSize
          - NodeGroupMaxSize
          - NodeGroupDesiredSize
          - DomainName
          - EnableALBController
          - EnableExternalDNS
      - Label:
          default: "Data Layer Sizing (Infrastructure)"
        Parameters:
          - RDSEngineVersion
          - RDSInstanceClass
          - RDSAllocatedStorage
          - RDSMaxAllocatedStorage
          - RDSStorageType
          - RDSIops
          - RDSDatabaseName
          - RDSMasterUsername
          - CreateReadReplica
          - RDSForceSSL
          - RDSMultiAZ
          - RDSDeletionProtection
          - RDSBackupRetentionPeriod
          - DocumentDBInstanceClass
          - DocumentDBInstanceCount
          - DocumentDBMasterUsername
          - DocumentDBDeletionProtection
          - DocumentDBBackupRetentionPeriod
          - ElastiCacheNodeType
          - AmazonMQInstanceType
          - AmazonMQDeploymentMode
          - AmazonMQAdminUsername
          - AdditionalIngressCIDR1
          - AdditionalIngressCIDR2
          - AdditionalIngressCIDR3
      - Label:
          default: "Licensing — Global"
        Parameters:
          - LicenseUseDevGateway
      - Label:
          default: "Delivery Backend (GitOps/ArgoCD) — Optional"
        Parameters:
          - PlatformDelivery
          - GitOpsRepoURL
          - GitOpsBranch
          - GitOpsPath
          - GitOpsDeploySSHKeySecretArn
          - GitOpsMode
      - Label:
          default: "Ingress (Shared ALB Settings)"
        Parameters:
          - IngressClassName
          - IngressCertificateArn
      - Label:
          default: "Module: Plugin Access Manager"
        Parameters:
          - EnableAccessManager
          - AccessManagerChartVersion
          - AuthorizerClientId
          - AuthorizerClientSecret
          - AccessManagerLicenseKey
          - EnableAccessManagerIdentityIngress
          - AccessManagerIdentityIngressHostname
          - EnableAccessManagerAuthIngress
          - AccessManagerAuthIngressHostname
          - AccessManagerValuesOverride
      - Label:
          default: "Module: Ledger (Midaz)"
        Parameters:
          - EnableLedger
          - LedgerChartVersion
          - EnableLedgerIngress
          - LedgerIngressHostname
          - LedgerValuesOverride
      - Label:
          default: "Module: Reporter"
        Parameters:
          - EnableReporter
          - ReporterChartVersion
          - EnableReporterIngress
          - ReporterIngressHostname
          - ReporterValuesOverride
      - Label:
          default: "Module: Fetcher"
        Parameters:
          - EnableFetcher
          - FetcherChartVersion
          - EnableFetcherIngress
          - FetcherIngressHostname
          - FetcherValuesOverride
          - MSKInstanceType
      - Label:
          default: "Module: Product Console"
        Parameters:
          - EnableConsole
          - ConsoleChartVersion
          - NextAuthUrl
          - EnableConsoleIngress
          - ConsoleIngressHostname
          - ConsoleValuesOverride
      - Label:
          default: "Module: BR Bank Transfer"
        Parameters:
          - EnableBankTransfer
          - BankTransferChartVersion
          - BankTransferLicenseKey
          - EnableBankTransferIngress
          - BankTransferIngressHostname
          - BankTransferValuesOverride
      - Label:
          default: "platform-orchestrator (controller)"
        Parameters:
          - PlatformNamespace
          - OrchestratorNamespace
          - OrchestratorChartRepo
          - OrchestratorChartVersion
      - Label:
          default: "OCI Helm Registry (private charts only)"
        Parameters:
          - HelmRegistryHost
          - HelmRegistryUser
          - HelmRegistryToken
      - Label:
          default: "Advanced"
        Parameters:
          - EnvironmentContractCARef
    ParameterLabels:
      # AWS Marketplace
      MPS3BucketName:
        default: "Template S3 Bucket Name"
      MPS3BucketRegion:
        default: "Template S3 Bucket Region"
      MPS3KeyPrefix:
        default: "Shared Template S3 Key Prefix"
      MPS3ProductKeyPrefix:
        default: "Lerian Platform Template S3 Key Prefix"
      # General
      ProjectName:
        default: "Project Name"
      EnvironmentName:
        default: "Environment"
      PermissionsBoundaryArn:
        default: "IAM Permissions Boundary ARN"
      # Network (Foundation)
      VpcCIDR:
        default: "VPC CIDR Block"
      AvailabilityZone1:
        default: "Availability Zone 1"
      AvailabilityZone2:
        default: "Availability Zone 2"
      AvailabilityZone3:
        default: "Availability Zone 3"
      EnableFlowLogs:
        default: "Enable VPC Flow Logs"
      FlowLogsRetentionDays:
        default: "Flow Logs Retention (Days)"
      KubernetesVersion:
        default: "Kubernetes Version"
      NodeInstanceType:
        default: "Node Instance Type"
      NodeGroupMinSize:
        default: "Minimum Nodes"
      NodeGroupMaxSize:
        default: "Maximum Nodes"
      NodeGroupDesiredSize:
        default: "Desired Nodes"
      DomainName:
        default: "Domain Name (Optional)"
      EnableALBController:
        default: "Enable ALB Controller"
      EnableExternalDNS:
        default: "Enable ExternalDNS"
      # Data Layer Sizing (Infrastructure)
      RDSEngineVersion:
        default: "RDS PostgreSQL Engine Version"
      RDSInstanceClass:
        default: "RDS Instance Class"
      RDSAllocatedStorage:
        default: "Initial Storage (GB)"
      RDSMaxAllocatedStorage:
        default: "Maximum Storage (GB)"
      RDSStorageType:
        default: "Storage Type"
      RDSIops:
        default: "Provisioned IOPS"
      RDSDatabaseName:
        default: "Database Name"
      RDSMasterUsername:
        default: "(Required) RDS Master Username"
      CreateReadReplica:
        default: "Create Read Replica"
      RDSForceSSL:
        default: "Force SSL Connections"
      RDSMultiAZ:
        default: "Multi-AZ Deployment"
      RDSDeletionProtection:
        default: "RDS Deletion Protection"
      RDSBackupRetentionPeriod:
        default: "RDS Backup Retention (Days)"
      DocumentDBInstanceClass:
        default: "DocumentDB Instance Class"
      DocumentDBInstanceCount:
        default: "DocumentDB Instance Count"
      DocumentDBMasterUsername:
        default: "(Required) DocumentDB Master Username"
      DocumentDBDeletionProtection:
        default: "DocumentDB Deletion Protection"
      DocumentDBBackupRetentionPeriod:
        default: "DocumentDB Backup Retention (Days)"
      ElastiCacheNodeType:
        default: "Cache Node Type"
      AmazonMQInstanceType:
        default: "Broker Instance Type"
      AmazonMQDeploymentMode:
        default: "Broker Deployment Mode"
      AmazonMQAdminUsername:
        default: "(Required) AmazonMQ Admin Username"
      AdditionalIngressCIDR1:
        default: "Additional CIDR 1"
      AdditionalIngressCIDR2:
        default: "Additional CIDR 2"
      AdditionalIngressCIDR3:
        default: "Additional CIDR 3"
      # Licensing — Global
      LicenseUseDevGateway:
        default: "Use Dev License Gateway"
      # Module: Access Manager
      EnableAccessManager:
        default: "Deploy Access Manager"
      AccessManagerChartVersion:
        default: "Access Manager Chart Version"
      AuthorizerClientId:
        default: "Authorizer Client ID"
      AuthorizerClientSecret:
        default: "Authorizer Client Secret (shared dev default — see CHECKPOINT.md)"
      AccessManagerLicenseKey:
