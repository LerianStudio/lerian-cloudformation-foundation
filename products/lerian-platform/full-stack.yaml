      IngressClassName:
        default: "Ingress Class Name"
      IngressCertificateArn:
        default: "ACM Certificate ARN"
      EnableConsoleIngress:
        default: "Enable Console Ingress"
      ConsoleIngressHostname:
        default: "Console Ingress Hostname"
      EnableLedgerIngress:
        default: "Enable Ledger Ingress"
      LedgerIngressHostname:
        default: "Ledger Ingress Hostname"
      EnableReporterIngress:
