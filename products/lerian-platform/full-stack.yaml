Parameters:
  # ===========================================================================
  # AWS MARKETPLACE PARAMETERS (Required for Nested Stacks)
  # ===========================================================================
  MPS3BucketName:
    Type: String
    Description: "S3 bucket name containing the CloudFormation templates (managed by AWS Marketplace)"
    Default: "lerian-cloudformation-templates"

  MPS3BucketRegion:
    Type: String
    Description: >-
      AWS Region where the S3 bucket is located. Fixed to sa-east-1 — the
      Application layer (orchestrator.yaml) embeds a region-specific CA
      bundle for RDS/DocumentDB TLS (see CHECKPOINT.md); deploying this
      stack outside sa-east-1 will fail TLS verification against the data
      layer.
    Default: "sa-east-1"
    AllowedValues:
      - sa-east-1

  MPS3KeyPrefix:
    Type: String
    Description: "S3 key prefix for the shared CloudFormation templates (foundation.yaml, rds.yaml, etc.)"
    Default: "releases/latest/"
    AllowedPattern: "^[a-zA-Z0-9-_./]*$"
    ConstraintDescription: "Key prefix can include alphanumeric characters, hyphens, underscores, periods, and forward slashes"

  MPS3ProductKeyPrefix:
    Type: String
    Description: "S3 key prefix for the Lerian Platform product templates (orchestrator.yaml)"
    Default: "releases/latest/products/lerian-platform/"
    AllowedPattern: "^[a-zA-Z0-9-_./]*$"
    ConstraintDescription: "Key prefix can include alphanumeric characters, hyphens, underscores, periods, and forward slashes"

  # ===========================================================================
  # GENERAL CONFIGURATION
  # ===========================================================================
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: "Optional IAM permissions boundary ARN. Applied to all IAM roles created by this stack. Leave empty to skip."

  EnvironmentName:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name for resource tagging

  ProjectName:
    Type: String
    Default: lerian-platform
    Description: Project name used for resource naming across every nested stack
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]*$"
    MinLength: 3
    MaxLength: 40
    ConstraintDescription: "Must begin with a letter, contain only letters, numbers, and hyphens, and be 3-40 characters long"

  # ===========================================================================
  # NETWORK (FOUNDATION)
  # ===========================================================================
  VpcCIDR:
    Type: String
    Default: 10.60.0.0/16
    Description: CIDR block for the VPC
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$

  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: sa-east-1a
    Description: First Availability Zone

  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: sa-east-1b
    Description: Second Availability Zone

  AvailabilityZone3:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: sa-east-1c
    Description: Third Availability Zone

  EnableFlowLogs:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
    Description: Enable VPC Flow Logs for network traffic auditing and security analysis.

  FlowLogsRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653
    Description: Number of days to retain VPC Flow Logs in CloudWatch.

  KubernetesVersion:
    Type: String
    Default: "1.35"
    AllowedValues:
      - "1.33"
      - "1.34"
      - "1.35"
    Description: Kubernetes version for the EKS cluster

  NodeInstanceType:
    Type: String
    # x86_64, NOT the inherited ARM64/Graviton default (foundation.yaml's own
    # default is c7g.large) — the pinned platform-orchestrator manager image
    # (OrchestratorChartVersion's Default in orchestrator.yaml,
    # v0.1.0-e2e-479ebfb-amd64) is single-arch amd64, the only architecture
    # actually live-validated end-to-end (c6i.xlarge, per CHECKPOINT.md). A
    # Graviton default here puts the operator pod in ImagePullBackOff/exec
    # format error on day one.
    Default: c6i.xlarge
    AllowedValues:
      - c7g.medium
      - c7g.large
      - c7g.xlarge
      - c7g.2xlarge
      - m7g.medium
      - m7g.large
      - m7g.xlarge
      - m7g.2xlarge
      - r7g.medium
      - r7g.large
      - r7g.xlarge
      - c6g.medium
      - c6g.large
      - c6g.xlarge
      - c6g.2xlarge
      - c6i.large
      - c6i.xlarge
      - c6i.2xlarge
      - m6g.medium
      - m6g.large
      - m6g.xlarge
    Description: EC2 instance type for EKS worker nodes (ARM64 Graviton)

  NodeGroupMinSize:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 100
    Description: Minimum number of worker nodes

  NodeGroupMaxSize:
    Type: Number
    Default: 15
    MinValue: 1
    MaxValue: 100
    Description: Maximum number of worker nodes

  NodeGroupDesiredSize:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 100
    Description: Desired number of worker nodes

  DomainName:
    Type: String
    Default: ""
    Description: "Domain name for Route53 private hosted zone (e.g., empresa.com). Leave empty to skip DNS setup."
    AllowedPattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?(\\.[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?)*$"
    ConstraintDescription: "Must be a valid domain name or empty"

  EnableALBController:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable AWS Load Balancer Controller for Ingress. Must be "true" if console Ingress is enabled below.

  EnableExternalDNS:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable ExternalDNS for automatic DNS management (requires Domain Name)

  # ===========================================================================
  # DATA LAYER SIZING (INFRASTRUCTURE)
  # ===========================================================================
  RDSEngineVersion:
    Type: String
    Default: "16.14"
    Description: |
      PostgreSQL major.minor.patch — must be available on RDS in the deploy
      region. Verify with `aws rds describe-db-engine-versions --engine
      postgres` before bumping.

  RDSInstanceClass:
    Type: String
    Default: db.t3.medium
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium
      - db.t3.large
      - db.m7g.large
      - db.m7g.xlarge
      - db.r7g.large
      - db.r7g.xlarge
      - db.r7g.2xlarge
      - db.r7g.4xlarge
      - db.r7g.8xlarge
      - db.r7g.12xlarge
      - db.r7g.16xlarge
    Description: RDS instance class

  RDSAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 65536
    Description: Initial storage allocation in GB

  RDSMaxAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 65536
    Description: Maximum storage for autoscaling in GB

  RDSStorageType:
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - io1
      - io2
    Description: Storage type for RDS instance

  RDSIops:
    Type: Number
    Default: 3000
    MinValue: 3000
    MaxValue: 64000
    Description: Provisioned IOPS for RDS storage. For gp3 max is 16000, for io1/io2 max is 64000.

  RDSDatabaseName:
    Type: String
    Default: midaz
    Description: Name of the initial database
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 64
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  RDSMasterUsername:
    Type: String
    NoEcho: true
    Description: Master username for RDS (required, no default for security)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 63
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  CreateReadReplica:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create a read replica for RDS

  RDSForceSSL:
    Type: String
    Default: "0"
    AllowedValues:
      - "0"
      - "1"
    Description: Force SSL/TLS connections to RDS (1 = enabled, 0 = disabled). Recommended for production with sensitive data.

  RDSMultiAZ:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable Multi-AZ deployment for high availability. Recommended for production workloads.

  RDSDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable deletion protection to prevent accidental database deletion.

  RDSBackupRetentionPeriod:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Number of days to retain automated backups (1-35). Recommended 30+ for production.

  DocumentDBInstanceClass:
    Type: String
    Default: db.t3.medium
    AllowedValues:
      - db.t3.medium
      - db.r6g.large
      - db.r6g.xlarge
      - db.r6g.2xlarge
      - db.r6g.4xlarge
      - db.r6g.8xlarge
      - db.r6g.12xlarge
    Description: DocumentDB instance class

  DocumentDBInstanceCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: Number of DocumentDB instances

  DocumentDBMasterUsername:
    Type: String
    NoEcho: true
    Description: Master username for DocumentDB (required, no default for security)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 63
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  DocumentDBDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable deletion protection to prevent accidental cluster deletion.

  DocumentDBBackupRetentionPeriod:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Number of days to retain automated backups (1-35). Recommended 30+ for production.

  ElastiCacheNodeType:
    Type: String
    # Trial-sized default (was cache.m7g.large, inherited from
    # infrastructure.yaml's own production-scale default) — every other
    # data-layer default in this template (RDSInstanceClass db.t3.medium,
    # AmazonMQInstanceType mq.t3.micro, DocumentDBInstanceCount 2,
    # RDSMultiAZ false) is already trial-sized; this was the one outlier.
    Default: cache.t3.small
    AllowedValues:
      - cache.t3.micro
      - cache.t3.small
      - cache.t3.medium
      - cache.m7g.large
      - cache.m7g.xlarge
      - cache.r7g.large
      - cache.r7g.xlarge
    Description: ElastiCache node type

  AmazonMQInstanceType:
    Type: String
    Default: mq.t3.micro
    AllowedValues:
      - mq.t3.micro
      - mq.m5.large
      - mq.m5.xlarge
      - mq.m5.2xlarge
      - mq.m5.4xlarge
      - mq.m7g.large
      - mq.m7g.xlarge
      - mq.m7g.2xlarge
      - mq.m7g.4xlarge
      - mq.m7g.8xlarge
      - mq.m7g.12xlarge
      - mq.m7g.16xlarge
    Description: AmazonMQ broker instance type

  AmazonMQDeploymentMode:
    Type: String
    Default: SINGLE_INSTANCE
    AllowedValues:
      - SINGLE_INSTANCE
      - CLUSTER_MULTI_AZ
    Description: Broker deployment mode. CLUSTER_MULTI_AZ deploys 3 nodes across AZs for HA.

  AmazonMQAdminUsername:
    Type: String
    NoEcho: true
    Description: Admin username for AmazonMQ (required, no default for security)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  AdditionalIngressCIDR1:
    Type: String
    Default: ""
    Description: "Additional CIDR block for resource access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

  AdditionalIngressCIDR2:
    Type: String
    Default: ""
    Description: "Additional CIDR block for resource access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

  AdditionalIngressCIDR3:
    Type: String
    Default: ""
    Description: "Additional CIDR block for resource access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

  # ===========================================================================
  # LICENSING — GLOBAL
  # ===========================================================================
  LicenseUseDevGateway:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Validate every *LicenseKey against license.dev.lerian.io instead of the
      production gateway. Leave "false" for real customer keys; only
      Lerian-internal sandbox testing uses dev-gateway keys.

  # ===========================================================================
  # MODULE: ACCESS MANAGER (CASDOOR)
  # ===========================================================================
  EnableAccessManager:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deploy the Access Manager (OAuth2/OIDC). Required by other modules for auth.

  AccessManagerChartVersion:
    Type: String
    Default: "9.2.0"
    Description: plugin-access-manager chart version

  AuthorizerClientId:
    Type: String
    Default: "ac56c81d4d6d95c0ac12"
    Description: >-
      Access Manager authorizer (platform M2M) client id. Default matches the
      seeded Casdoor application "app-lerian" (files/init_data.json).

  AuthorizerClientSecret:
    Type: String
    Default: "6add4bc64f394456a77fa85708ad8c9b67e39e4c"
    NoEcho: true
    Description: >-
      Authorizer client secret. DEV-ONLY SHARED DEFAULT — every deploy that
      doesn't override this AND ship a custom init_data.json gets the same
      M2M secret as every other deploy. Do not expose this stack's Console/
      API endpoints to the public internet without rotating it. See
      CHECKPOINT.md.

  AccessManagerOrganizationIds:
    Type: String
    Default: ""
    Description: "Comma-separated organization IDs for the Access Manager (optional)."

  AccessManagerLicenseKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Lerian license key for the Access Manager (auth + identity). Required for licensed operation."

  AccessManagerValuesOverride:
    Type: String
    Default: ""
    Description: "Advanced: raw YAML merged into spec.modules.access_manager.valuesOverride. See orchestrator.yaml's own Parameter description for the exact shape expected."

  # ===========================================================================
  # MODULE: LEDGER (MIDAZ)
  # ===========================================================================
  EnableLedger:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deploy the Ledger (Midaz) module

  LedgerChartVersion:
    Type: String
    Default: "9.1.0"
    Description: midaz-helm chart version. See orchestrator.yaml's own Parameter description for the compatibility check behind this pin.

  LedgerValuesOverride:
    Type: String
    Default: ""
    Description: "Advanced: raw YAML merged into spec.modules.ledger.valuesOverride (also covers the bundled crm/tracer subcomponents). See orchestrator.yaml's own Parameter description for the exact shape expected."

  # ===========================================================================
  # MODULE: REPORTER
  # ===========================================================================
  EnableReporter:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Deploy the Reporter module

  ReporterChartVersion:
    Type: String
    Default: "4.1.0"
    Description: reporter-helm chart version

  ReporterValuesOverride:
    Type: String
    Default: ""
    Description: "Advanced: raw YAML merged into spec.modules.reporter.valuesOverride. See orchestrator.yaml's own Parameter description for the exact shape expected."

  # ===========================================================================
  # MODULE: FETCHER
  # ===========================================================================
  EnableFetcher:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Deploy the Fetcher module

  FetcherChartVersion:
    Type: String
    Default: "3.1.0"
    Description: fetcher-helm chart version

  FetcherLicenseKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Lerian license key for Fetcher. Each licensed plugin has its own key."

  FetcherValuesOverride:
    Type: String
    Default: ""
    Description: "Advanced: raw YAML merged into spec.modules.fetcher.valuesOverride. See orchestrator.yaml's own Parameter description for the exact shape expected."

  # ===========================================================================
  # MODULE: PRODUCT CONSOLE
  # ===========================================================================
  EnableConsole:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deploy the Product Console

  ConsoleChartVersion:
    Type: String
    Default: "4.0.0"
    Description: product-console-helm chart version

  NextAuthUrl:
    Type: String
    Default: ""
    Description: Full public URL for the product console (required for console auth)

  EnableIngress:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable ALB Ingress for the product console. Requires "Enable ALB Controller" above.

  IngressHostname:
    Type: String
    Default: ""
    Description: Hostname for the console Ingress

  IngressScheme:
    Type: String
    Default: "internet-facing"
    AllowedValues: ["internal", "internet-facing"]
    Description: ALB scheme

  IngressCertificateArn:
    Type: String
    Default: ""
    Description: ACM Certificate ARN for HTTPS (optional)

  ConsoleValuesOverride:
    Type: String
    Default: ""
    Description: "Advanced: raw YAML merged into spec.modules.console.valuesOverride. See orchestrator.yaml's own Parameter description for the exact shape expected."

  # ===========================================================================
  # MODULE: BR BANK TRANSFER
  # ===========================================================================
  EnableBankTransfer:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Deploy the BR Bank Transfer plugin

  BankTransferChartVersion:
    Type: String
    Default: "2.0.0"
    Description: plugin-br-bank-transfer-helm chart version

  BankTransferLicenseKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Lerian license key for the BR Bank Transfer plugin. Each licensed plugin has its own key."

  BankTransferValuesOverride:
    Type: String
    Default: ""
    Description: "Advanced: raw YAML merged into spec.modules.bank_transfer.valuesOverride. See orchestrator.yaml's own Parameter description for the exact shape expected."

  # ===========================================================================
  # PLATFORM-ORCHESTRATOR (CONTROLLER)
  # ===========================================================================
  PlatformNamespace:
    Type: String
    Default: lerian-platform
    Description: Base namespace label for platform components (per-app namespaces are used for chart compatibility)

  OperatorNamespace:
    Type: String
    Default: lerian-operator
    Description: >-
      Namespace the platform-orchestrator chart installs into. Matches the
      chart's own default (values.yaml).

  OrchestratorChartRepo:
    Type: String
    Default: "oci://ghcr.io/lerianstudio/alpha/platform-orchestrator-helm"
    Description: >-
      OCI ref for the platform-orchestrator Helm chart. Currently an
      alpha build — see orchestrator.yaml's inline comment for details.

  OrchestratorChartVersion:
    Type: String
    Default: "0.1.0-e2e.37a282a"
    Description: >-
      platform-orchestrator chart version. See orchestrator.yaml's own
      Parameter description for the full live-validation provenance of
      this pin — this bump consolidates Tracer into the Ledger module
      (no more standalone EnableTracer/TracerChartVersion parameters).

  # ===========================================================================
  # OCI HELM REGISTRY (private charts only)
  # ===========================================================================
  HelmRegistryHost:
    Type: String
    Default: "ghcr.io"
    Description: "OCI registry host for private Helm charts."
  HelmRegistryUser:
    Type: String
    Default: ""
    Description: "Registry username (leave empty to skip login — public charts only)."
  HelmRegistryToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Registry token/password with read:packages (only needed if a chart is private)."

  # ===========================================================================
  # ADVANCED
  # ===========================================================================
  EnvironmentContractCARef:
    Type: String
    Default: ""
    Description: >-
      Base64 PEM CA bundle override for a non-sa-east-1 region (advanced).
      Left empty by default — orchestrator.yaml's Lambda embeds a working
      sa-east-1 fallback. See its Parameter description for details.

Rules:
  IngressRequiresALBController:
    RuleCondition: !Equals [!Ref EnableIngress, "true"]
    Assertions:
      - Assert: !Equals [!Ref EnableALBController, "true"]
        AssertDescription: "Enable ALB Controller must be 'true' when Enable ALB Ingress (Console) is 'true'"

Conditions:
  CreateRDSReplica: !Equals [!Ref CreateReadReplica, "true"]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  # S3 buckets + IRSA role for reporter/fetcher object storage — ported from
  # the legacy full-stack.yaml this template replaced (that one already had
  # this working, confirmed live: without it, reporter/fetcher pods crash
  # with "bucket name is required" the moment either module is enabled,
  # since orchestrator.yaml itself intentionally does not provision S3/IRSA
  # — it only accepts a bucket name + role ARN as parameters).
  EnableReporterCond: !Equals [!Ref EnableReporter, "true"]
  EnableFetcherCond: !Equals [!Ref EnableFetcher, "true"]
  HasObjectStorageBucket: !Or [!Condition EnableReporterCond, !Condition EnableFetcherCond]
  BothStorageBuckets: !And [!Condition EnableReporterCond, !Condition EnableFetcherCond]

Resources:
  # ===========================================================================
  # OBJECT STORAGE — S3 buckets + IRSA role (reporter + fetcher)
  # ===========================================================================
  ReporterStorageBucket:
    # checkov:skip=CKV_AWS_18:Access logging optional for this workload bucket
    # checkov:skip=CKV_AWS_21:Versioning enabled via VersioningConfiguration below
    Type: AWS::S3::Bucket
    Condition: EnableReporterCond
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-reporter-storage-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-reporter-storage"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  FetcherStorageBucket:
    # checkov:skip=CKV_AWS_18:Access logging optional for this workload bucket
    # checkov:skip=CKV_AWS_21:Versioning enabled via VersioningConfiguration below
    Type: AWS::S3::Bucket
    Condition: EnableFetcherCond
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-fetcher-storage-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-fetcher-storage"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  ObjectStorageRole:
    Type: AWS::IAM::Role
    Condition: HasObjectStorageBucket
    Properties:
      # RoleName omitted (CFN auto-generates it) — an explicit name can
      # overflow IAM's 64-char limit for long ProjectNames.
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderHost}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OIDCProviderHost}:aud": "sts.amazonaws.com"
                    },
                    "StringLike": {
                      "${OIDCProviderHost}:sub": [
                        "system:serviceaccount:reporter:reporter-*",
                        "system:serviceaccount:fetcher:fetcher-*"
                      ]
                    }
                  }
                }
              ]
            }
          - OIDCProviderHost: !Select [1, !Split ["oidc-provider/", !GetAtt FoundationStack.Outputs.OIDCProviderArn]]
      Policies:
        - PolicyName: ObjectStorageAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                # CFN has no list-concatenation intrinsic, so the "both
                # buckets enabled" case is spelled out explicitly rather
                # than combining two conditional lists. HasObjectStorageBucket
                # (this resource's own Condition) already guarantees at
                # least one of EnableReporterCond/EnableFetcherCond is true,
                # so the innermost else can safely assume EnableFetcherCond.
                Resource: !If
                  - BothStorageBuckets
                  - - !GetAtt ReporterStorageBucket.Arn
                    - !Sub "${ReporterStorageBucket.Arn}/*"
                    - !GetAtt FetcherStorageBucket.Arn
                    - !Sub "${FetcherStorageBucket.Arn}/*"
                  - !If
                    - EnableReporterCond
                    - - !GetAtt ReporterStorageBucket.Arn
                      - !Sub "${ReporterStorageBucket.Arn}/*"
                    - - !GetAtt FetcherStorageBucket.Arn
                      - !Sub "${FetcherStorageBucket.Arn}/*"

  # ===========================================================================
  # FOUNDATION STACK (VPC + EKS + optional Route53/ALB Controller/ExternalDNS)
  # ===========================================================================
  FoundationStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}foundation.yaml"
      Parameters:
        MPS3BucketName: !Ref MPS3BucketName
        MPS3BucketRegion: !Ref MPS3BucketRegion
        MPS3KeyPrefix: !Ref MPS3KeyPrefix
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        VpcCIDR: !Ref VpcCIDR
        AvailabilityZone1: !Ref AvailabilityZone1
        AvailabilityZone2: !Ref AvailabilityZone2
        AvailabilityZone3: !Ref AvailabilityZone3
        EnableFlowLogs: !Ref EnableFlowLogs
        FlowLogsRetentionDays: !Ref FlowLogsRetentionDays
        KubernetesVersion: !Ref KubernetesVersion
        NodeInstanceType: !Ref NodeInstanceType
        NodeGroupMinSize: !Ref NodeGroupMinSize
        NodeGroupMaxSize: !Ref NodeGroupMaxSize
        NodeGroupDesiredSize: !Ref NodeGroupDesiredSize
        DomainName: !Ref DomainName
        EnableALBController: !Ref EnableALBController
        EnableExternalDNS: !Ref EnableExternalDNS
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-foundation-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # ===========================================================================
  # INFRASTRUCTURE STACK (RDS + DocumentDB + ElastiCache + AmazonMQ)
  # Wired directly to FoundationStack's outputs via the Existing* override
  # parameters infrastructure.yaml already supports — bypasses its
  # FoundationStackName/Fn::ImportValue path entirely so this composition has
  # no cross-stack Export/Import ordering to reason about.
  # ===========================================================================
  InfrastructureStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}products/midaz/infrastructure.yaml"
      Parameters:
        MPS3BucketName: !Ref MPS3BucketName
        MPS3BucketRegion: !Ref MPS3BucketRegion
        MPS3KeyPrefix: !Ref MPS3KeyPrefix
        MPS3ProductKeyPrefix: "releases/latest/products/midaz/"
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        ExistingVpcId: !GetAtt FoundationStack.Outputs.VpcId
        ExistingVpcCIDR: !Ref VpcCIDR
        ExistingPrivateSubnetIds: !GetAtt FoundationStack.Outputs.PrivateSubnetIds
        ExistingDatabaseSubnetIds: !GetAtt FoundationStack.Outputs.DatabaseSubnetIds
        ExistingClusterName: !GetAtt FoundationStack.Outputs.EKSClusterName
        ExistingOIDCProviderArn: !GetAtt FoundationStack.Outputs.OIDCProviderArn
        RDSEngineVersion: !Ref RDSEngineVersion
        RDSInstanceClass: !Ref RDSInstanceClass
        RDSAllocatedStorage: !Ref RDSAllocatedStorage
        RDSMaxAllocatedStorage: !Ref RDSMaxAllocatedStorage
        RDSStorageType: !Ref RDSStorageType
        RDSIops: !Ref RDSIops
        RDSDatabaseName: !Ref RDSDatabaseName
        RDSMasterUsername: !Ref RDSMasterUsername
        CreateReadReplica: !Ref CreateReadReplica
        RDSForceSSL: !Ref RDSForceSSL
        RDSMultiAZ: !Ref RDSMultiAZ
        RDSDeletionProtection: !Ref RDSDeletionProtection
        RDSBackupRetentionPeriod: !Ref RDSBackupRetentionPeriod
        DocumentDBInstanceClass: !Ref DocumentDBInstanceClass
        DocumentDBInstanceCount: !Ref DocumentDBInstanceCount
        DocumentDBMasterUsername: !Ref DocumentDBMasterUsername
        DocumentDBDeletionProtection: !Ref DocumentDBDeletionProtection
        DocumentDBBackupRetentionPeriod: !Ref DocumentDBBackupRetentionPeriod
        ElastiCacheNodeType: !Ref ElastiCacheNodeType
        AmazonMQInstanceType: !Ref AmazonMQInstanceType
        AmazonMQDeploymentMode: !Ref AmazonMQDeploymentMode
        AmazonMQAdminUsername: !Ref AmazonMQAdminUsername
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-infrastructure-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # ===========================================================================
  # APPLICATION STACK (platform-orchestrator + module catalog) — nests the
  # existing orchestrator.yaml unmodified; every endpoint/secret/cluster
  # parameter it would otherwise ask a human for is wired here from
  # FoundationStack/InfrastructureStack outputs instead.
  # ===========================================================================
  ApplicationStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3ProductKeyPrefix}orchestrator.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        ClusterName: !GetAtt FoundationStack.Outputs.EKSClusterName
        PlatformNamespace: !Ref PlatformNamespace
        OperatorNamespace: !Ref OperatorNamespace
        # Data layer — wired from InfrastructureStack, not asked of the human
        RDSEndpoint: !GetAtt InfrastructureStack.Outputs.RDSEndpoint
        RDSReplicaEndpoint: !If [CreateRDSReplica, !GetAtt InfrastructureStack.Outputs.RDSReplicaEndpoint, ""]
        RDSSecretArn: !GetAtt InfrastructureStack.Outputs.RDSSecretArn
        DocumentDBEndpoint: !GetAtt InfrastructureStack.Outputs.DocumentDBEndpoint
        DocumentDBSecretArn: !GetAtt InfrastructureStack.Outputs.DocumentDBSecretArn
        ElastiCacheEndpoint: !GetAtt InfrastructureStack.Outputs.ElastiCacheEndpoint
        ElastiCacheSecretArn: !GetAtt InfrastructureStack.Outputs.ElastiCacheSecretArn
        AmazonMQEndpoint: !GetAtt InfrastructureStack.Outputs.AmazonMQEndpoint
        AmazonMQSecretArn: !GetAtt InfrastructureStack.Outputs.AmazonMQSecretArn
        # MSK is not part of this composition — infrastructure.yaml does not
        # provision it (no MSK template in this repo's midaz pattern yet).
        # orchestrator.yaml's own defaults ("") apply, which disable
        # streaming consumers.
        RDSKMSKeyArn: !GetAtt InfrastructureStack.Outputs.RDSKMSKeyArn
        DocumentDBKMSKeyArn: !GetAtt InfrastructureStack.Outputs.DocumentDBKMSKeyArn
        ElastiCacheKMSKeyArn: !GetAtt InfrastructureStack.Outputs.ElastiCacheKMSKeyArn
        AmazonMQKMSKeyArn: !GetAtt InfrastructureStack.Outputs.AmazonMQKMSKeyArn
        # Per-app object storage — provisioned above (ReporterStorageBucket/
        # FetcherStorageBucket/ObjectStorageRole), conditionally on the
        # matching module being enabled.
        ReporterStorageBucketName: !If [EnableReporterCond, !Ref ReporterStorageBucket, ""]
        FetcherStorageBucketName: !If [EnableFetcherCond, !Ref FetcherStorageBucket, ""]
        ObjectStorageRoleArn: !If [HasObjectStorageBucket, !GetAtt ObjectStorageRole.Arn, ""]
        # Module enable/disable
        EnableLedger: !Ref EnableLedger
        EnableReporter: !Ref EnableReporter
        EnableFetcher: !Ref EnableFetcher
        EnableConsole: !Ref EnableConsole
        EnableAccessManager: !Ref EnableAccessManager
        EnableBankTransfer: !Ref EnableBankTransfer
        # Module chart versions
        LedgerChartVersion: !Ref LedgerChartVersion
        ReporterChartVersion: !Ref ReporterChartVersion
        FetcherChartVersion: !Ref FetcherChartVersion
        ConsoleChartVersion: !Ref ConsoleChartVersion
        AccessManagerChartVersion: !Ref AccessManagerChartVersion
        BankTransferChartVersion: !Ref BankTransferChartVersion
        # platform-orchestrator itself
        OrchestratorChartRepo: !Ref OrchestratorChartRepo
        OrchestratorChartVersion: !Ref OrchestratorChartVersion
        # Access Manager — authorizer/licensing
        AuthorizerClientId: !Ref AuthorizerClientId
        AuthorizerClientSecret: !Ref AuthorizerClientSecret
        AccessManagerLicenseKey: !Ref AccessManagerLicenseKey
        FetcherLicenseKey: !Ref FetcherLicenseKey
        BankTransferLicenseKey: !Ref BankTransferLicenseKey
        AccessManagerOrganizationIds: !Ref AccessManagerOrganizationIds
        LicenseUseDevGateway: !Ref LicenseUseDevGateway
        # OCI Helm registry auth
        HelmRegistryHost: !Ref HelmRegistryHost
        HelmRegistryUser: !Ref HelmRegistryUser
        HelmRegistryToken: !Ref HelmRegistryToken
        # Console / ingress
        NextAuthUrl: !Ref NextAuthUrl
        EnableIngress: !Ref EnableIngress
        IngressHostname: !Ref IngressHostname
        IngressScheme: !Ref IngressScheme
        IngressCertificateArn: !Ref IngressCertificateArn
        # Per-module valuesOverride (advanced)
        AccessManagerValuesOverride: !Ref AccessManagerValuesOverride
        LedgerValuesOverride: !Ref LedgerValuesOverride
        ReporterValuesOverride: !Ref ReporterValuesOverride
        FetcherValuesOverride: !Ref FetcherValuesOverride
        ConsoleValuesOverride: !Ref ConsoleValuesOverride
        BankTransferValuesOverride: !Ref BankTransferValuesOverride
        # EnvironmentContract TLS override (advanced)
        EnvironmentContractCARef: !Ref EnvironmentContractCARef
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-application-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  # ===========================================================================
  # OBJECT STORAGE
  # ===========================================================================
  ReporterStorageBucketName:
    Condition: EnableReporterCond
    Description: S3 bucket provisioned for Reporter object storage
    Value: !Ref ReporterStorageBucket

  FetcherStorageBucketName:
    Condition: EnableFetcherCond
    Description: S3 bucket provisioned for Fetcher object storage
    Value: !Ref FetcherStorageBucket

  ObjectStorageRoleArn:
    Condition: HasObjectStorageBucket
    Description: IRSA role ARN reporter/fetcher pods assume for S3 access
    Value: !GetAtt ObjectStorageRole.Arn

  # ===========================================================================
  # STACK METADATA
  # ===========================================================================
  ProjectName:
    Description: Project name used in this deployment
    Value: !Ref ProjectName

  EnvironmentName:
    Description: Environment name
    Value: !Ref EnvironmentName

  # ===========================================================================
  # FOUNDATION OUTPUTS
  # ===========================================================================
  VpcId:
    Description: VPC ID
    Value: !GetAtt FoundationStack.Outputs.VpcId

  EKSClusterName:
    Description: EKS Cluster Name
    Value: !GetAtt FoundationStack.Outputs.EKSClusterName

  EKSClusterEndpoint:
    Description: EKS Cluster Endpoint
    Value: !GetAtt FoundationStack.Outputs.EKSClusterEndpoint

  # ===========================================================================
  # INFRASTRUCTURE OUTPUTS
  # ===========================================================================
  RDSEndpoint:
    Description: RDS Primary Endpoint
    Value: !GetAtt InfrastructureStack.Outputs.RDSEndpoint

  DocumentDBEndpoint:
    Description: DocumentDB Cluster Endpoint
    Value: !GetAtt InfrastructureStack.Outputs.DocumentDBEndpoint

  ElastiCacheEndpoint:
    Description: ElastiCache Primary Endpoint
    Value: !GetAtt InfrastructureStack.Outputs.ElastiCacheEndpoint

  AmazonMQEndpoint:
    Description: AmazonMQ Broker Endpoint
    Value: !GetAtt InfrastructureStack.Outputs.AmazonMQEndpoint

  # ===========================================================================
  # APPLICATION OUTPUTS
  # ===========================================================================
  OrchestratorDeployerFunctionArn:
    Description: Orchestrator deployer Lambda ARN
    Value: !GetAtt ApplicationStack.Outputs.DeployerFunctionArn

  OrchestratorDeployerLogGroup:
    Description: CloudWatch Log Group for the orchestrator deployer
    Value: !GetAtt ApplicationStack.Outputs.DeployerLogGroup

  # ===========================================================================
  # UTILITY COMMANDS
  # ===========================================================================
  KubeconfigCommand:
    Description: Command to configure kubectl
    Value: !Sub "aws eks update-kubeconfig --name ${FoundationStack.Outputs.EKSClusterName} --region ${AWS::Region}"

  CheckPlatformCommand:
    Description: Command to check the Platform CR status once the operator has reconciled
    Value: !Sub "kubectl get platform -n ${OperatorNamespace}"
