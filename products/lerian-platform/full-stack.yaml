AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Lerian Platform - Complete Stack (AWS Marketplace)
  Deploys the complete Lerian Platform infrastructure AND application suite in a
  single stack, with per-module activation flags. Standalone Helm chart per app.
  Modules: Ledger (Midaz), Reporter, Tracer, Fetcher, Product Console,
  Access Manager, BR Bank Transfer, Plugin Fees.
  Infra topology is selectable via InfraTopology (shared | dedicated).
  NOTE: this first cut implements InfraTopology=shared (mirrors the proven GitOps
  topology). InfraTopology=dedicated (one infra set per app) is delivered next
  (plan Phase 1.1b).
  (c) Lerian Studio - https://lerian.studio

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "AWS Marketplace Configuration"
        Parameters:
          - MPS3BucketName
          - MPS3BucketRegion
          - MPS3KeyPrefix
          - MarketplaceAMI
      - Label:
          default: "General Configuration"
        Parameters:
          - EnvironmentName
          - ProjectName
          - PermissionsBoundaryArn
          - InfraTopology
      - Label:
          default: "Module Activation (choose what to deploy)"
        Parameters:
          - DeployApplication
          - EnableLedger
          - EnableReporter
          - EnableTracer
          - EnableFetcher
          - EnableConsole
          - EnableAccessManager
          - EnableBankTransfer
          - EnableFees
      - Label:
          default: "Cluster Configuration"
        Parameters:
          - UseExistingCluster
          - ExistingClusterName
          - ExistingVpcId
          - ExistingPrivateSubnetIds
          - ExistingOIDCProviderArn
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcCIDR
          - AvailabilityZone1
          - AvailabilityZone2
          - AvailabilityZone3
          - EnableFlowLogs
          - FlowLogsRetentionDays
      - Label:
          default: "EKS Configuration"
        Parameters:
          - KubernetesVersion
          - NodeInstanceType
          - NodeGroupMinSize
          - NodeGroupMaxSize
          - NodeGroupDesiredSize
      - Label:
          default: "RDS PostgreSQL Configuration"
        Parameters:
          - RDSInstanceClass
          - RDSAllocatedStorage
          - RDSMaxAllocatedStorage
          - RDSStorageType
          - RDSIops
          - RDSDatabaseName
          - RDSMasterUsername
          - CreateReadReplica
          - RDSForceSSL
          - RDSMultiAZ
          - RDSDeletionProtection
          - RDSBackupRetentionPeriod
      - Label:
          default: "DocumentDB Configuration"
        Parameters:
          - DocumentDBInstanceClass
          - DocumentDBInstanceCount
          - DocumentDBMasterUsername
          - DocumentDBDeletionProtection
          - DocumentDBBackupRetentionPeriod
      - Label:
          default: "ElastiCache (Valkey/Redis) Configuration"
        Parameters:
          - ElastiCacheNodeType
      - Label:
          default: "AmazonMQ (RabbitMQ) Configuration"
        Parameters:
          - AmazonMQInstanceType
          - AmazonMQDeploymentMode
          - AmazonMQAdminUsername
      - Label:
          default: "MSK (Kafka) Configuration"
        Parameters:
          - MSKInstanceType
          - MSKKafkaVersion
          - MSKNumberOfBrokerNodes
          - MSKBrokerStorageGB
      - Label:
          default: "Plugin Licenses (one Lerian license key per licensed app)"
        Parameters:
          - AccessManagerLicenseKey
          - FetcherLicenseKey
          - FeesLicenseKey
          - BankTransferLicenseKey
          - LicenseUseDevGateway
      - Label:
          default: "Additional Network Access"
        Parameters:
          - AdditionalIngressCIDR1
          - AdditionalIngressCIDR2
          - AdditionalIngressCIDR3
      - Label:
          default: "DNS Configuration"
        Parameters:
          - EnableALBController
          - EnableExternalDNS
          - DomainName
      - Label:
          default: "Application Configuration"
        Parameters:
          - PlatformNamespace
          - NextAuthUrl
      - Label:
          default: "Console Ingress Configuration"
        Parameters:
          - EnableIngress
          - IngressHostname
          - IngressScheme
          - IngressCertificateArn
      - Label:
          default: "GitOps Lifecycle (optional - leave empty for self-contained helm-install)"
        Parameters:
          - GitOpsRepoUrl
          - GitOpsBranch
          - GitOpsPath
          - GitOpsDeployKey
    ParameterLabels:
      MPS3BucketName:
        default: "Template S3 Bucket Name"
      MPS3BucketRegion:
        default: "Template S3 Bucket Region"
      MPS3KeyPrefix:
        default: "Template S3 Key Prefix"
      MarketplaceAMI:
        default: "Marketplace AMI ID"
      EnvironmentName:
        default: "Environment"
      ProjectName:
        default: "Project Name"
      PermissionsBoundaryArn:
        default: "IAM Permissions Boundary ARN"
      InfraTopology:
        default: "Infrastructure Topology"
      DeployApplication:
        default: "Deploy Application Suite (Helm)"
      EnableLedger:
        default: "Enable Ledger (Midaz)"
      EnableReporter:
        default: "Enable Reporter"
      EnableTracer:
        default: "Enable Tracer"
      EnableFetcher:
        default: "Enable Fetcher"
      EnableConsole:
        default: "Enable Product Console"
      EnableAccessManager:
        default: "Enable Access Manager"
      EnableBankTransfer:
        default: "Enable BR Bank Transfer"
      EnableFees:
        default: "Enable Plugin Fees"
      UseExistingCluster:
        default: "Use Existing Cluster"
      ExistingClusterName:
        default: "Existing Cluster Name"
      ExistingVpcId:
        default: "Existing VPC ID"
      ExistingPrivateSubnetIds:
        default: "Existing Private Subnet IDs"
      ExistingOIDCProviderArn:
        default: "Existing OIDC Provider ARN"
      VpcCIDR:
        default: "VPC CIDR Block"
      AvailabilityZone1:
        default: "Availability Zone 1"
      AvailabilityZone2:
        default: "Availability Zone 2"
      AvailabilityZone3:
        default: "Availability Zone 3"
      EnableFlowLogs:
        default: "Enable VPC Flow Logs"
      FlowLogsRetentionDays:
        default: "Flow Logs Retention (Days)"
      KubernetesVersion:
        default: "Kubernetes Version"
      NodeInstanceType:
        default: "Node Instance Type"
      NodeGroupMinSize:
        default: "Minimum Nodes"
      NodeGroupMaxSize:
        default: "Maximum Nodes"
      NodeGroupDesiredSize:
        default: "Desired Nodes"
      RDSInstanceClass:
        default: "RDS Instance Class"
      RDSAllocatedStorage:
        default: "Initial Storage (GB)"
      RDSMaxAllocatedStorage:
        default: "Maximum Storage (GB)"
      RDSStorageType:
        default: "Storage Type"
      RDSIops:
        default: "Provisioned IOPS"
      RDSDatabaseName:
        default: "Database Name"
      RDSMasterUsername:
        default: "Master Username"
      CreateReadReplica:
        default: "Create Read Replica"
      RDSForceSSL:
        default: "Force SSL Connections"
      RDSMultiAZ:
        default: "Multi-AZ Deployment"
      RDSDeletionProtection:
        default: "Deletion Protection"
      RDSBackupRetentionPeriod:
        default: "Backup Retention (Days)"
      DocumentDBInstanceClass:
        default: "DocumentDB Instance Class"
      DocumentDBInstanceCount:
        default: "Number of Instances"
      DocumentDBMasterUsername:
        default: "Master Username"
      DocumentDBDeletionProtection:
        default: "Deletion Protection"
      DocumentDBBackupRetentionPeriod:
        default: "Backup Retention (Days)"
      ElastiCacheNodeType:
        default: "Cache Node Type"
      AmazonMQInstanceType:
        default: "Broker Instance Type"
      AmazonMQDeploymentMode:
        default: "Deployment Mode"
      AmazonMQAdminUsername:
        default: "Admin Username"
      AdditionalIngressCIDR1:
        default: "Additional CIDR 1"
      AdditionalIngressCIDR2:
        default: "Additional CIDR 2"
      AdditionalIngressCIDR3:
        default: "Additional CIDR 3"
      EnableALBController:
        default: "Enable ALB Controller"
      EnableExternalDNS:
        default: "Enable ExternalDNS"
      DomainName:
        default: "Domain Name"
      PlatformNamespace:
        default: "Kubernetes Namespace"
      NextAuthUrl:
        default: "Console Public URL"
      EnableIngress:
        default: "Enable Console Ingress (ALB)"
      IngressHostname:
        default: "Console Ingress Hostname"
      IngressScheme:
        default: "Ingress Scheme"
      IngressCertificateArn:
        default: "ACM Certificate ARN"
      GitOpsRepoUrl:
        default: "GitOps Repo URL (SSH)"
      GitOpsBranch:
        default: "GitOps Branch"
      GitOpsPath:
        default: "GitOps Path"
      GitOpsDeployKey:
        default: "GitOps Deploy Key (SSH private)"

Parameters:
  # =============================================================================
  # AWS MARKETPLACE PARAMETERS (Required for Nested Stacks)
  # =============================================================================
  MPS3BucketName:
    Type: String
    Description: "S3 bucket name containing the CloudFormation templates (managed by AWS Marketplace)"
    Default: "lerian-cloudformation-templates"

  MPS3BucketRegion:
    Type: String
    Description: "AWS Region where the S3 bucket is located (fixed to sa-east-1)"
    Default: "sa-east-1"
    AllowedValues:
      - sa-east-1

  MPS3KeyPrefix:
    Type: String
    Description: "S3 key prefix for the CloudFormation templates"
    Default: "releases/latest/products/lerian-platform/"
    AllowedPattern: "^[a-zA-Z0-9-_./]*$"
    ConstraintDescription: "Key prefix can include alphanumeric characters, hyphens, underscores, periods, and forward slashes"

  MarketplaceAMI:
    Type: String
    Description: "AWS Marketplace AMI ID (required by Marketplace form only, EKS uses managed AMIs)"
    Default: "ami-placeholder"

  # =============================================================================
  # GENERAL CONFIGURATION
  # =============================================================================
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name for resource tagging

  ProjectName:
    Type: String
    Default: lerian-platform
    Description: Project name used for resource naming
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]*$"
    MinLength: 3
    MaxLength: 128
    ConstraintDescription: "Must begin with a letter, contain only letters, numbers, and hyphens, and be 3-128 characters long"

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: "Optional IAM permissions boundary ARN. Applied to all IAM roles created by this stack. Leave empty to skip."

  InfraTopology:
    Type: String
    Default: "shared"
    AllowedValues:
      - "shared"
      - "dedicated"
    Description: |
      Infrastructure topology. "shared" (recommended, mirrors the proven GitOps
      topology; lower cost) = one RDS + DocumentDB + ElastiCache + AmazonMQ with
      logical databases per module. "dedicated" = each enabled module gets its own
      dedicated data instances (full isolation; higher cost) via per-app stacks.

  # =============================================================================
  # MODULE ACTIVATION
  # =============================================================================
  DeployApplication:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Deploy the application suite via Helm (set to false for infrastructure-only deployment)

  EnableLedger:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the Ledger (Midaz) module — the double-entry core ledger. Recommended for all deployments.

  EnableReporter:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the Reporter module (regulatory/operational reports). Provisions an S3 bucket for report storage.

  EnableTracer:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the Tracer module (real-time transaction validation and fraud prevention).

  EnableFetcher:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the Fetcher module (data extraction). Provisions an S3 bucket for extracted data.

  EnableConsole:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the Product Console (admin UI). Aggregates the enabled modules.

  EnableAccessManager:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the Access Manager (OAuth2/OIDC over Casdoor). Required by other modules for authentication.

  EnableBankTransfer:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the BR Bank Transfer plugin (TED via JD rail).

  EnableFees:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the Plugin Fees module (embedded fee calculation).

  # =============================================================================
  # CLUSTER CONFIGURATION
  # =============================================================================
  UseExistingCluster:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: |
      Set to true to deploy services into an existing VPC and EKS cluster
      (e.g., when deploying a second product to a shared cluster).
      When true, ExistingClusterName, ExistingVpcId and ExistingPrivateSubnetIds are required.

  ExistingClusterName:
    Type: String
    Default: ""
    Description: "Name of the existing EKS cluster (required when UseExistingCluster=true)"

  ExistingVpcId:
    Type: String
    Default: ""
    Description: "VPC ID where services will be deployed (required when UseExistingCluster=true)"

  ExistingPrivateSubnetIds:
    Type: String
    Default: ""
    Description: "Comma-separated list of private subnet IDs (required when UseExistingCluster=true)"

  ExistingOIDCProviderArn:
    Type: String
    Default: ""
    Description: "OIDC Provider ARN of the existing EKS cluster (required when EnableALBController=true or EnableExternalDNS=true with UseExistingCluster=true)"

  # =============================================================================
  # NETWORK CONFIGURATION
  # =============================================================================
  VpcCIDR:
    Type: String
    Default: 10.50.0.0/16
    Description: CIDR block for the VPC
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$

  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: First Availability Zone

  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Second Availability Zone

  AvailabilityZone3:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Third Availability Zone

  EnableFlowLogs:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "true"
    Description: Enable VPC Flow Logs for network traffic auditing and security analysis.

  FlowLogsRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653
    Description: Number of days to retain VPC Flow Logs in CloudWatch.

  # =============================================================================
  # EKS CONFIGURATION
  # =============================================================================
  KubernetesVersion:
    Type: String
    Default: "1.35"
    AllowedValues:
      - "1.33"
      - "1.34"
      - "1.35"
    Description: Kubernetes version for EKS cluster

  NodeAmiType:
    Type: String
    Default: AL2023_x86_64_STANDARD
    AllowedValues:
      - AL2023_x86_64_STANDARD
      - AL2023_ARM_64_STANDARD
    Description: >-
      EKS node AMI architecture — MUST match NodeInstanceType. Default x86 because the
      Lerian container images are amd64. For Graviton nodes (c7g/m7g/r7g/c6g/m6g) set
      AL2023_ARM_64_STANDARD (only if all images are multi-arch/ARM).

  NodeInstanceType:
    Type: String
    Default: c6i.xlarge
    AllowedValues:
      - c7g.large
      - c7g.xlarge
      - c7g.2xlarge
      - m7g.large
      - m7g.xlarge
      - m7g.2xlarge
      - r7g.large
      - r7g.xlarge
      - c6g.large
      - c6g.xlarge
      - c6g.2xlarge
      - c6i.large
      - c6i.xlarge
      - c6i.2xlarge
      - m6g.large
      - m6g.xlarge
    Description: EC2 instance type for EKS worker nodes (ARM64 Graviton recommended)

  NodeGroupMinSize:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 100
    Description: Minimum number of worker nodes

  NodeGroupMaxSize:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 100
    Description: Maximum number of worker nodes

  NodeGroupDesiredSize:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 100
    Description: Desired number of worker nodes

  # =============================================================================
  # RDS POSTGRESQL CONFIGURATION (shared: ledger, tracer, access-manager, bank-transfer)
  # =============================================================================
  RDSEngineVersion:
    Type: String
    Default: "16.9"
    Description: "PostgreSQL engine version (must be available in the target region; e.g. 16.9+)."

  RDSInstanceClass:
    Type: String
    Default: db.r7g.large
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium
      - db.t3.large
      - db.m7g.large
      - db.m7g.xlarge
      - db.r7g.large
      - db.r7g.xlarge
      - db.r7g.2xlarge
      - db.r7g.4xlarge
      - db.r7g.8xlarge
      - db.r7g.12xlarge
      - db.r7g.16xlarge
    Description: RDS instance class

  RDSAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 65536
    Description: Initial storage allocation in GB

  RDSMaxAllocatedStorage:
    Type: Number
    Default: 500
    MinValue: 20
    MaxValue: 65536
    Description: Maximum storage for autoscaling in GB

  RDSStorageType:
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - io1
      - io2
    Description: Storage type for RDS instance

  RDSIops:
    Type: Number
    Default: 3000
    MinValue: 3000
    MaxValue: 64000
    Description: Provisioned IOPS for RDS storage. For gp3 max is 16000, for io1/io2 max is 64000.

  RDSDatabaseName:
    Type: String
    Default: midaz
    Description: Name of the initial database
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 64
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  RDSMasterUsername:
    Type: String
    NoEcho: true
    Description: Master username for RDS (required, no default for security)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 63
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  CreateReadReplica:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Create a read replica for RDS (used by ledger onboarding/transaction)

  RDSForceSSL:
    Type: String
    Default: "1"
    AllowedValues:
      - "0"
      - "1"
    Description: Force SSL/TLS connections to RDS (1 = enabled, 0 = disabled). Recommended for production.

  RDSMultiAZ:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable Multi-AZ deployment for high availability. Recommended for production workloads.

  RDSDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable deletion protection to prevent accidental database deletion.

  RDSBackupRetentionPeriod:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 35
    Description: Number of days to retain automated backups (1-35). Recommended 30+ for production.

  # =============================================================================
  # DOCUMENTDB CONFIGURATION (shared: ledger, reporter, fetcher, console, fees, bank-transfer)
  # =============================================================================
  DocumentDBInstanceClass:
    Type: String
    Default: db.r6g.large
    AllowedValues:
      - db.t3.medium
      - db.r6g.large
      - db.r6g.xlarge
      - db.r6g.2xlarge
      - db.r6g.4xlarge
      - db.r6g.8xlarge
      - db.r6g.12xlarge
    Description: DocumentDB instance class

  DocumentDBInstanceCount:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
    Description: Number of DocumentDB instances

  DocumentDBMasterUsername:
    Type: String
    NoEcho: true
    Description: Master username for DocumentDB (required, no default for security)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 63
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  DocumentDBDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable deletion protection to prevent accidental cluster deletion.

  DocumentDBBackupRetentionPeriod:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 35
    Description: Number of days to retain automated backups (1-35). Recommended 30+ for production.

  # =============================================================================
  # ELASTICACHE CONFIGURATION (shared: ledger, reporter, fetcher, plugins)
  # =============================================================================
  ElastiCacheNodeType:
    Type: String
    Default: cache.m7g.large
    AllowedValues:
      - cache.t3.micro
      - cache.t3.small
      - cache.t3.medium
      - cache.m7g.large
      - cache.m7g.xlarge
      - cache.r7g.large
      - cache.r7g.xlarge
    Description: ElastiCache node type

  # =============================================================================
  # AMAZONMQ CONFIGURATION (shared: ledger, reporter, fetcher)
  # =============================================================================
  AmazonMQInstanceType:
    Type: String
    Default: mq.m5.large
    AllowedValues:
      - mq.t3.micro
      - mq.m5.large
      - mq.m5.xlarge
      - mq.m5.2xlarge
      - mq.m5.4xlarge
      - mq.m7g.large
      - mq.m7g.xlarge
      - mq.m7g.2xlarge
      - mq.m7g.4xlarge
      - mq.m7g.8xlarge
      - mq.m7g.12xlarge
      - mq.m7g.16xlarge
    Description: AmazonMQ broker instance type

  AmazonMQDeploymentMode:
    Type: String
    Default: SINGLE_INSTANCE
    AllowedValues:
      - SINGLE_INSTANCE
      - CLUSTER_MULTI_AZ
    Description: Broker deployment mode. CLUSTER_MULTI_AZ deploys 3 nodes across AZs for HA.

  AmazonMQAdminUsername:
    Type: String
    NoEcho: true
    Description: Admin username for AmazonMQ (required, no default for security)
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: "Must begin with a letter and contain only alphanumeric characters and underscores"

  # =============================================================================
  # MSK (KAFKA) CONFIGURATION (shared: streaming backbone)
  # =============================================================================
  MSKInstanceType:
    Type: String
    Default: kafka.m5.large
    AllowedValues:
      - kafka.t3.small
      - kafka.m5.large
      - kafka.m5.xlarge
      - kafka.m5.2xlarge
      - kafka.m5.4xlarge
      - kafka.m7g.large
      - kafka.m7g.xlarge
      - kafka.m7g.2xlarge
      - kafka.m7g.4xlarge
    Description: MSK broker instance type

  MSKKafkaVersion:
    Type: String
    Default: 3.6.0
    Description: Apache Kafka version for the MSK cluster

  MSKNumberOfBrokerNodes:
    Type: Number
    Default: 2
    AllowedValues:
      - 2
      - 3
    Description: Number of MSK broker nodes (must be a multiple of the number of AZs)

  MSKBrokerStorageGB:
    Type: Number
    Default: 20
    Description: EBS storage per MSK broker, in GB

  # =============================================================================
  # ADDITIONAL NETWORK ACCESS
  # =============================================================================
  AdditionalIngressCIDR1:
    Type: String
    Default: ""
    Description: "Additional CIDR block for resource access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

  AdditionalIngressCIDR2:
    Type: String
    Default: ""
    Description: "Additional CIDR block for resource access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

  AdditionalIngressCIDR3:
    Type: String
    Default: ""
    Description: "Additional CIDR block for resource access (e.g., VPN, VPC peering). Leave empty to skip."
    AllowedPattern: "^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/([0-9]|[1-2][0-9]|3[0-2]))$"
    ConstraintDescription: "Must be a valid CIDR block or empty"

  # =============================================================================
  # DNS CONFIGURATION
  # =============================================================================
  EnableALBController:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable AWS Load Balancer Controller for Ingress

  EnableExternalDNS:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable ExternalDNS for automatic DNS management (requires DomainName)

  DomainName:
    Type: String
    Default: ""
    Description: "Base domain name of the hosted zone (e.g., lerian.net). Leave empty to skip DNS setup."
    AllowedPattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?(\\.[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?)*$"
    ConstraintDescription: "Must be a valid domain name or empty"

  # =============================================================================
  # APPLICATION CONFIGURATION
  # =============================================================================
  PlatformNamespace:
    Type: String
    Default: lerian-platform
    Description: Kubernetes namespace for all Lerian Platform components
    AllowedPattern: "^[a-z][a-z0-9-]*$"
    ConstraintDescription: "Must be a valid Kubernetes namespace name"

  NextAuthUrl:
    Type: String
    Default: ""
    Description: "Full public URL for the product console (e.g., https://console.example.com). Required for console authentication."
    AllowedPattern: "^$|^https?://.+$"
    ConstraintDescription: "Must be a valid URL starting with http:// or https://"

  # =============================================================================
  # ACCESS MANAGER CONFIGURATION
  # =============================================================================
  AccessManagerLicenseKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Lerian license key for the Access Manager (required for licensed operation; leave empty for unlicensed/dev)."

  FetcherLicenseKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Lerian license key for Fetcher (each licensed plugin has its own key; leave empty for unlicensed/dev)."

  FeesLicenseKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Lerian license key for the Fees plugin (each licensed plugin has its own key; leave empty for unlicensed/dev)."

  BankTransferLicenseKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Lerian license key for the BR Bank Transfer plugin (each licensed plugin has its own key; leave empty for unlicensed/dev)."

  AccessManagerOrganizationIds:
    Type: String
    Default: ""
    Description: "Comma-separated organization IDs for the Access Manager (optional)."

  LicenseUseDevGateway:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Validate every *LicenseKey against license.dev.lerian.io instead of the
      production gateway (license.lerian.io). A license key is issued for ONE
      specific gateway and is rejected outright (404 "License not found") by
      the other — this must match how your keys were issued. Leave "false"
      (the safe default) for real customer keys; only Lerian-internal sandbox
      testing uses dev-gateway keys.

  ConsoleAdminPassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Initial Casdoor admin password (console login). Leave empty to auto-generate (read from the <release>-admin Secret)."

  # =============================================================================
  # OCI HELM REGISTRY (optional; for any private OCI Helm charts)
  # =============================================================================
  HelmRegistryHost:
    Type: String
    Default: "ghcr.io"
    Description: "OCI registry host for private Helm charts."
  HelmRegistryUser:
    Type: String
    Default: ""
    Description: "Registry username (empty = skip login, public charts only)."
  HelmRegistryToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Registry token with read:packages (only needed if a chart is private)."

  # =============================================================================
  # CONSOLE INGRESS CONFIGURATION
  # =============================================================================
  EnableIngress:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable ALB Ingress for the product console external access

  IngressHostname:
    Type: String
    Default: ""
    Description: "Full hostname for Console Ingress (e.g., console.lerian.net)"
    AllowedPattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?(\\.[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?)*$"
    ConstraintDescription: "Must be a valid hostname or empty"

  IngressScheme:
    Type: String
    Default: "internet-facing"
    AllowedValues:
      - "internal"
      - "internet-facing"
    Description: "ALB scheme - internal (private) or internet-facing (public). Console is typically internet-facing."

  IngressCertificateArn:
    Type: String
    Default: ""
    Description: "ACM Certificate ARN for HTTPS (optional)"
    AllowedPattern: "^$|^arn:aws:acm:[a-z0-9-]+:[0-9]+:certificate/[a-f0-9-]+$"
    ConstraintDescription: "Must be a valid ACM certificate ARN or empty"

  # ---------------------------------------------------------------------------
  # GitOps lifecycle (optional). When GitOpsRepoUrl + GitOpsDeployKey are set the
  # deployer seeds the client's repo and installs ArgoCD + ESO for day-2. Left
  # empty, the deployer runs the self-contained helm-install path (no external Git).
  # ---------------------------------------------------------------------------
  GitOpsRepoUrl:
    Type: String
    Default: ""
    Description: "Git repo URL (SSH) for the GitOps seeder. Empty = self-contained helm-install mode."

  GitOpsBranch:
    Type: String
    Default: "main"
    Description: "Branch to seed (GitOps mode)."

  GitOpsPath:
    Type: String
    Default: "environments/production"
    Description: "Path within the repo where the app-of-apps and values are written (GitOps mode)."

  GitOpsDeployKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "SSH deploy key (private) with push access to the repo (GitOps mode). Empty = helm-install mode."

Rules:
  IngressRequiresALBController:
    RuleCondition: !Equals [!Ref EnableIngress, "true"]
    Assertions:
      - Assert: !Equals [!Ref EnableALBController, "true"]
        AssertDescription: "EnableALBController must be 'true' when EnableIngress is 'true'"

Conditions:
  CreateNewCluster: !Equals [!Ref UseExistingCluster, "false"]
  CreateRDSReplica: !Equals [!Ref CreateReadReplica, "true"]
  HasDomainName: !Not [!Equals [!Ref DomainName, ""]]
  ShouldEnableALBController: !Equals [!Ref EnableALBController, "true"]
  ShouldEnableExternalDNS: !And
    - !Condition HasDomainName
    - !Equals [!Ref EnableExternalDNS, "true"]

  # Topology
  IsShared: !Equals [!Ref InfraTopology, "shared"]
  IsDedicated: !Equals [!Ref InfraTopology, "dedicated"]

  # Module conditions
  EnableLedgerCond: !Equals [!Ref EnableLedger, "true"]
  EnableTracerCond: !Equals [!Ref EnableTracer, "true"]
  EnableConsoleCond: !Equals [!Ref EnableConsole, "true"]
  EnableAccessManagerCond: !Equals [!Ref EnableAccessManager, "true"]
  EnableBankTransferCond: !Equals [!Ref EnableBankTransfer, "true"]
  EnableFeesCond: !Equals [!Ref EnableFees, "true"]
  EnableReporterCond: !Equals [!Ref EnableReporter, "true"]
  EnableFetcherCond: !Equals [!Ref EnableFetcher, "true"]

  # Per-app dedicated stack conditions (IsDedicated AND Enable<app>)
  DedicatedLedger:       !And [!Condition IsDedicated, !Condition EnableLedgerCond]
  DedicatedReporter:     !And [!Condition IsDedicated, !Condition EnableReporterCond]
  DedicatedTracer:       !And [!Condition IsDedicated, !Condition EnableTracerCond]
  DedicatedFetcher:      !And [!Condition IsDedicated, !Condition EnableFetcherCond]
  DedicatedConsole:      !And [!Condition IsDedicated, !Condition EnableConsoleCond]
  DedicatedAccessManager: !And [!Condition IsDedicated, !Condition EnableAccessManagerCond]
  DedicatedBankTransfer: !And [!Condition IsDedicated, !Condition EnableBankTransferCond]
  DedicatedFees:         !And [!Condition IsDedicated, !Condition EnableFeesCond]

  # S3 buckets (only reporter/fetcher; shared topology uses the top-level
  # buckets, dedicated topology creates them inside each app-stack)
  SharedReporterBucket: !And [!Condition IsShared, !Condition EnableReporterCond]
  SharedFetcherBucket:  !And [!Condition IsShared, !Condition EnableFetcherCond]
  # Gates ObjectStorageRole (IRSA) — created when either bucket exists.
  HasObjectStorageBucket: !Or [!Condition SharedReporterBucket, !Condition SharedFetcherBucket]
  BothStorageBuckets:     !And [!Condition SharedReporterBucket, !Condition SharedFetcherBucket]
  # ObjectStorageRole is defined directly in THIS template (not a nested
  # stack, unlike eks.yaml/helm.yaml which each define their own copy of this
  # same condition), so it needs its own.
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

  # Application conditions (shared-topology helm stacks require IsShared)
  ShouldDeployApplication: !Equals [!Ref DeployApplication, "true"]
  ShouldDeployWithALB: !And
    - !Condition IsShared
    - !Condition ShouldDeployApplication
    - !Condition ShouldEnableALBController
  ShouldDeployWithoutALB: !And
    - !Condition IsShared
    - !Condition ShouldDeployApplication
    - !Not [!Condition ShouldEnableALBController]

Resources:
  # =============================================================================
  # FOUNDATION — VPC
  # =============================================================================
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewCluster
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}vpc.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref AWS::StackName
        EnvironmentName: !Ref EnvironmentName
        VpcCIDR: !Ref VpcCIDR
        AvailabilityZone1: !Ref AvailabilityZone1
        AvailabilityZone2: !Ref AvailabilityZone2
        AvailabilityZone3: !Ref AvailabilityZone3
        EnableFlowLogs: !Ref EnableFlowLogs
        FlowLogsRetentionDays: !Ref FlowLogsRetentionDays
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # SHARED DATA — RDS PostgreSQL
  # (logical DBs per module: onboarding, transaction, tracer, casdoor, bank_transfer)
  # =============================================================================
  RDSStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsShared
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}rds.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref AWS::StackName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        VpcCIDR: !Ref VpcCIDR
        DatabaseSubnetIds: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.DatabaseSubnetIds, !Ref ExistingPrivateSubnetIds]
        EngineVersion: !Ref RDSEngineVersion
        InstanceClass: !Ref RDSInstanceClass
        AllocatedStorage: !Ref RDSAllocatedStorage
        MaxAllocatedStorage: !Ref RDSMaxAllocatedStorage
        StorageType: !Ref RDSStorageType
        Iops: !Ref RDSIops
        DatabaseName: !Ref RDSDatabaseName
        MasterUsername: !Ref RDSMasterUsername
        CreateReadReplica: !Ref CreateReadReplica
        ForceSSL: !Ref RDSForceSSL
        MultiAZ: !Ref RDSMultiAZ
        DeletionProtection: !Ref RDSDeletionProtection
        BackupRetentionPeriod: !Ref RDSBackupRetentionPeriod
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-rds-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # SHARED DATA — DocumentDB
  # (logical DBs: onboarding, transaction, midaz-crm, reporter, fetcher-db,
  #  product-console-mt, plugin-fees-db, bank-transfer-db)
  # =============================================================================
  DocumentDBStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsShared
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}documentdb.yaml"
      Parameters:
        ProjectName: !Ref AWS::StackName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        VpcCIDR: !Ref VpcCIDR
        PrivateSubnetIds: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.PrivateSubnetIds, !Ref ExistingPrivateSubnetIds]
        InstanceClass: !Ref DocumentDBInstanceClass
        InstanceCount: !Ref DocumentDBInstanceCount
        MasterUsername: !Ref DocumentDBMasterUsername
        DeletionProtection: !Ref DocumentDBDeletionProtection
        BackupRetentionPeriod: !Ref DocumentDBBackupRetentionPeriod
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-documentdb-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # SHARED DATA — ElastiCache (Valkey)
  # =============================================================================
  ElastiCacheStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsShared
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}elasticache.yaml"
      Parameters:
        ProjectName: !Ref AWS::StackName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        VpcCIDR: !Ref VpcCIDR
        CacheSubnetIds: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.DatabaseSubnetIds, !Ref ExistingPrivateSubnetIds]
        NodeType: !Ref ElastiCacheNodeType
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-elasticache-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # SHARED DATA — AmazonMQ (RabbitMQ)
  # =============================================================================
  AmazonMQStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsShared
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}amazonmq.yaml"
      Parameters:
        ProjectName: !Ref AWS::StackName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        VpcCIDR: !Ref VpcCIDR
        PrivateSubnetIds: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.PrivateSubnetIds, !Ref ExistingPrivateSubnetIds]
        InstanceType: !Ref AmazonMQInstanceType
        DeploymentMode: !Ref AmazonMQDeploymentMode
        AdminUsername: !Ref AmazonMQAdminUsername
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-amazonmq-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # SHARED DATA — MSK (Kafka)
  # =============================================================================
  MSKStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsShared
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}msk.yaml"
      Parameters:
        ProjectName: !Ref AWS::StackName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        VpcCIDR: !Ref VpcCIDR
        PrivateSubnetIds: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.PrivateSubnetIds, !Ref ExistingPrivateSubnetIds]
        InstanceType: !Ref MSKInstanceType
        KafkaVersion: !Ref MSKKafkaVersion
        NumberOfBrokerNodes: !Ref MSKNumberOfBrokerNodes
        BrokerStorageGB: !Ref MSKBrokerStorageGB
        AdditionalIngressCIDR1: !Ref AdditionalIngressCIDR1
        AdditionalIngressCIDR2: !Ref AdditionalIngressCIDR2
        AdditionalIngressCIDR3: !Ref AdditionalIngressCIDR3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-msk-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # S3 BUCKETS (per-app object storage — created only when the module is enabled)
  # =============================================================================
  ReporterStorageBucket:
    # checkov:skip=CKV_AWS_18:Access logging optional for this workload bucket
    # checkov:skip=CKV_AWS_21:Versioning enabled via VersioningConfiguration below
    Type: AWS::S3::Bucket
    Condition: SharedReporterBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-reporter-storage-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-reporter-storage"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  FetcherStorageBucket:
    # checkov:skip=CKV_AWS_18:Access logging optional for this workload bucket
    # checkov:skip=CKV_AWS_21:Versioning enabled via VersioningConfiguration below
    Type: AWS::S3::Bucket
    Condition: SharedFetcherBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-fetcher-storage-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-fetcher-storage"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # FOUNDATION — EKS
  # =============================================================================
  EKSStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewCluster
    # No DependsOn on the shared data stacks: those only exist in shared topology,
    # and EKS creation is independent of them (VPC dependency is implicit via GetAtt).
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}eks.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref AWS::StackName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt VPCStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt VPCStack.Outputs.PrivateSubnetIds
        KubernetesVersion: !Ref KubernetesVersion
        NodeInstanceType: !Ref NodeInstanceType
        NodeAmiType: !Ref NodeAmiType
        NodeGroupMinSize: !Ref NodeGroupMinSize
        NodeGroupMaxSize: !Ref NodeGroupMaxSize
        NodeGroupDesiredSize: !Ref NodeGroupDesiredSize
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-eks-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # FOUNDATION — Route53 (Private Hosted Zone)
  # =============================================================================
  Route53Stack:
    Type: AWS::CloudFormation::Stack
    Condition: HasDomainName
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}route53.yaml"
      Parameters:
        ProjectName: !Ref AWS::StackName
        EnvironmentName: !Ref EnvironmentName
        DomainName: !Ref DomainName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-route53-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # OBJECT STORAGE IRSA (reporter + fetcher)
  # =============================================================================
  # Grants ReporterStorageBucket/FetcherStorageBucket access to the reporter/
  # fetcher pods' own ServiceAccounts (IRSA — no static access keys). Was
  # entirely missing (confirmed live: reporter/fetcher pods crashed with
  # "bucket name is required" / no S3 permissions when manually tested against
  # a stack that had EnableReporter/EnableFetcher off at create time) — the
  # bucket resources above and the REPORTER_S3_BUCKET/FETCHER_S3_BUCKET env
  # vars into orchestrator.yaml already existed, but nothing ever created this
  # role or consumed those env vars on the Python side (see orchestrator.yaml's
  # render_environment_contract/render_platform for the other half of this fix).
  ObjectStorageRole:
    Type: AWS::IAM::Role
    Condition: HasObjectStorageBucket
    Properties:
      # RoleName omitted — see EBSCSIDriverRole's identical reasoning in
      # templates/eks.yaml (explicit names overflow IAM's 64-char limit for
      # long ProjectNames); CFN auto-generates it, consumers use !GetAtt .Arn.
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderHost}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OIDCProviderHost}:aud": "sts.amazonaws.com"
                    },
                    "StringLike": {
                      "${OIDCProviderHost}:sub": [
                        "system:serviceaccount:reporter:reporter-*",
                        "system:serviceaccount:fetcher:fetcher-*"
                      ]
                    }
                  }
                }
              ]
            }
          - OIDCProviderHost: !If
              - CreateNewCluster
              - !GetAtt EKSStack.Outputs.OIDCProviderHost
              # Bring-your-own-cluster path: ExistingOIDCProviderArn is
              # "arn:aws:iam::ACCOUNT:oidc-provider/HOST" — strip the prefix.
              - !Select [1, !Split ["oidc-provider/", !Ref ExistingOIDCProviderArn]]
      Policies:
        - PolicyName: ObjectStorageAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                # CFN has no list-concatenation intrinsic, so the "both buckets
                # enabled" case is spelled out explicitly rather than combining
                # two conditional lists. HasObjectStorageBucket (this
                # resource's own Condition) already guarantees at least one of
                # SharedReporterBucket/SharedFetcherBucket is true, so the
                # innermost else can safely assume SharedFetcherBucket.
                Resource: !If
                  - BothStorageBuckets
                  - - !GetAtt ReporterStorageBucket.Arn
                    - !Sub "${ReporterStorageBucket.Arn}/*"
                    - !GetAtt FetcherStorageBucket.Arn
                    - !Sub "${FetcherStorageBucket.Arn}/*"
                  - !If
                    - SharedReporterBucket
                    - - !GetAtt ReporterStorageBucket.Arn
                      - !Sub "${ReporterStorageBucket.Arn}/*"
                    - - !GetAtt FetcherStorageBucket.Arn
                      - !Sub "${FetcherStorageBucket.Arn}/*"

  # =============================================================================
  # FOUNDATION — ALB Controller
  # =============================================================================
  ALBControllerStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldEnableALBController
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}alb-controller.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref AWS::StackName
        EnvironmentName: !Ref EnvironmentName
        VpcId: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
        ClusterName: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.ClusterName, !Ref ExistingClusterName]
        OIDCProviderArn: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.OIDCProviderArn, !Ref ExistingOIDCProviderArn]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-controller-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # FOUNDATION — ExternalDNS
  # =============================================================================
  ExternalDNSStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldEnableExternalDNS
    DependsOn: Route53Stack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}external-dns.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref AWS::StackName
        EnvironmentName: !Ref EnvironmentName
        ClusterName: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.ClusterName, !Ref ExistingClusterName]
        OIDCProviderArn: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.OIDCProviderArn, !Ref ExistingOIDCProviderArn]
        PrivateHostedZoneId: !GetAtt Route53Stack.Outputs.PrivateHostedZoneId
        DomainName: !Ref DomainName
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-external-dns-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # =============================================================================
  # APPLICATION — Helm (with ALB Controller dependency)
  # Installs the standalone chart of each enabled module (see helm.yaml, Phase 1.2).
  # =============================================================================
  PlatformHelmStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployWithALB
    DependsOn:
      - RDSStack
      - DocumentDBStack
      - ElastiCacheStack
      - AmazonMQStack
      - MSKStack
      - ALBControllerStack
    Properties:
      TemplateURL: !Sub "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}helm.yaml"
      Parameters:
        PermissionsBoundaryArn: !Ref PermissionsBoundaryArn
        ProjectName: !Ref AWS::StackName
        EnvironmentName: !Ref EnvironmentName
        ClusterName: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.ClusterName, !Ref ExistingClusterName]
        # Shared data connections
        RDSEndpoint: !GetAtt RDSStack.Outputs.Endpoint
        RDSReplicaEndpoint: !If [CreateRDSReplica, !GetAtt RDSStack.Outputs.ReplicaEndpoint, ""]
        RDSSecretArn: !GetAtt RDSStack.Outputs.SecretArn
        DocumentDBEndpoint: !GetAtt DocumentDBStack.Outputs.ClusterEndpoint
        DocumentDBSecretArn: !GetAtt DocumentDBStack.Outputs.SecretArn
        ElastiCacheEndpoint: !GetAtt ElastiCacheStack.Outputs.PrimaryEndpoint
        ElastiCacheSecretArn: !GetAtt ElastiCacheStack.Outputs.AuthSecretArn
        AmazonMQEndpoint: !GetAtt AmazonMQStack.Outputs.BrokerEndpoint
        AmazonMQSecretArn: !GetAtt AmazonMQStack.Outputs.SecretArn
        MSKClusterArn: !GetAtt MSKStack.Outputs.ClusterArn
        MSKSecretArn: !GetAtt MSKStack.Outputs.SecretArn
        # KMS keys for secret decryption
        RDSKMSKeyArn: !GetAtt RDSStack.Outputs.KMSKeyArn
        DocumentDBKMSKeyArn: !GetAtt DocumentDBStack.Outputs.KMSKeyArn
        ElastiCacheKMSKeyArn: !GetAtt ElastiCacheStack.Outputs.KMSKeyArn
        AmazonMQKMSKeyArn: !GetAtt AmazonMQStack.Outputs.KMSKeyArn
        MSKKMSKeyArn: !GetAtt MSKStack.Outputs.KMSKeyArn
        # Per-app object storage (empty when the module is disabled)
        ReporterStorageBucketName: !If [SharedReporterBucket, !Ref ReporterStorageBucket, ""]
        FetcherStorageBucketName: !If [SharedFetcherBucket, !Ref FetcherStorageBucket, ""]
        ObjectStorageRoleArn: !If [HasObjectStorageBucket, !GetAtt ObjectStorageRole.Arn, ""]
        # Module activation flags (consumed by helm.yaml — see Phase 1.2)
        EnableLedger: !Ref EnableLedger
        EnableReporter: !Ref EnableReporter
        EnableTracer: !Ref EnableTracer
        EnableFetcher: !Ref EnableFetcher
        EnableConsole: !Ref EnableConsole
        EnableAccessManager: !Ref EnableAccessManager
        EnableBankTransfer: !Ref EnableBankTransfer
        EnableFees: !Ref EnableFees
        # Application config
        PlatformNamespace: !Ref PlatformNamespace
        NextAuthUrl: !Ref NextAuthUrl
        # Access Manager
        AccessManagerLicenseKey: !Ref AccessManagerLicenseKey
        FetcherLicenseKey: !Ref FetcherLicenseKey
        FeesLicenseKey: !Ref FeesLicenseKey
        BankTransferLicenseKey: !Ref BankTransferLicenseKey
        AccessManagerOrganizationIds: !Ref AccessManagerOrganizationIds
        LicenseUseDevGateway: !Ref LicenseUseDevGateway
        # OCI registry auth (private charts)
        HelmRegistryHost: !Ref HelmRegistryHost
        HelmRegistryUser: !Ref HelmRegistryUser
        HelmRegistryToken: !Ref HelmRegistryToken
        # Console Ingress
        EnableIngress: !Ref EnableIngress
        IngressHostname: !Ref IngressHostname
        IngressScheme: !Ref IngressScheme
        IngressCertificateArn: !Ref IngressCertificateArn
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-platform-app-stack"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

