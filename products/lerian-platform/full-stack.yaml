Outputs:
  ProjectName:
    Description: Project name used in this deployment (stack name)
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub "${AWS::StackName}-ProjectName"

  EnvironmentName:
    Description: Environment name
    Value: !Ref EnvironmentName
    Export:
      Name: !Sub "${AWS::StackName}-EnvironmentName"

  InfraTopology:
    Description: Infrastructure topology used by this deployment
    Value: !Ref InfraTopology

  VpcId:
    Description: VPC ID
    Value: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.VpcId, !Ref ExistingVpcId]
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  PrivateSubnetIds:
    Description: Private Subnet IDs
    Value: !If [CreateNewCluster, !GetAtt VPCStack.Outputs.PrivateSubnetIds, !Ref ExistingPrivateSubnetIds]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"

  EKSClusterName:
    Description: EKS Cluster Name
    Value: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.ClusterName, !Ref ExistingClusterName]
    Export:
      Name: !Sub "${AWS::StackName}-EKSClusterName"

  EKSClusterEndpoint:
    Condition: CreateNewCluster
    Description: EKS Cluster Endpoint
    Value: !GetAtt EKSStack.Outputs.ClusterEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-EKSClusterEndpoint"

  OIDCProviderArn:
    Description: EKS OIDC Provider ARN
    Value: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.OIDCProviderArn, !Ref ExistingOIDCProviderArn]
    Export:
      Name: !Sub "${AWS::StackName}-OIDCProviderArn"

  RDSEndpoint:
    Condition: IsShared
    Description: Shared RDS Primary Endpoint
    Value: !GetAtt RDSStack.Outputs.Endpoint
    Export:
      Name: !Sub "${AWS::StackName}-RDSEndpoint"

  DocumentDBEndpoint:
    Condition: IsShared
    Description: Shared DocumentDB Cluster Endpoint
    Value: !GetAtt DocumentDBStack.Outputs.ClusterEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-DocumentDBEndpoint"

  ElastiCacheEndpoint:
    Condition: IsShared
    Description: Shared ElastiCache Primary Endpoint
    Value: !GetAtt ElastiCacheStack.Outputs.PrimaryEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-ElastiCacheEndpoint"

  AmazonMQEndpoint:
    Condition: IsShared
    Description: Shared AmazonMQ Broker Endpoint
    Value: !GetAtt AmazonMQStack.Outputs.BrokerEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-AmazonMQEndpoint"

  # Secret ARNs + KMS keys — exported so the "Application only" delivery
  # (application.yaml) can import them via Fn::ImportValue (shared topology).
  RDSReplicaEndpoint:
    Condition: CreateRDSReplica
    Description: Shared RDS Read Replica Endpoint
    Value: !GetAtt RDSStack.Outputs.ReplicaEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-RDSReplicaEndpoint"

  RDSSecretArn:
    Condition: IsShared
    Description: Shared RDS Password Secret ARN
    Value: !GetAtt RDSStack.Outputs.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-RDSSecretArn"

  RDSKMSKeyArn:
    Condition: IsShared
    Description: Shared RDS KMS Key ARN
    Value: !GetAtt RDSStack.Outputs.KMSKeyArn
    Export:
      Name: !Sub "${AWS::StackName}-RDSKMSKeyArn"

  DocumentDBSecretArn:
    Condition: IsShared
    Description: Shared DocumentDB Password Secret ARN
    Value: !GetAtt DocumentDBStack.Outputs.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-DocumentDBSecretArn"

  DocumentDBKMSKeyArn:
    Condition: IsShared
    Description: Shared DocumentDB KMS Key ARN
    Value: !GetAtt DocumentDBStack.Outputs.KMSKeyArn
    Export:
      Name: !Sub "${AWS::StackName}-DocumentDBKMSKeyArn"

  ElastiCacheSecretArn:
    Condition: IsShared
    Description: Shared ElastiCache Auth Secret ARN
    Value: !GetAtt ElastiCacheStack.Outputs.AuthSecretArn
    Export:
      Name: !Sub "${AWS::StackName}-ElastiCacheSecretArn"

  ElastiCacheKMSKeyArn:
    Condition: IsShared
    Description: Shared ElastiCache KMS Key ARN
    Value: !GetAtt ElastiCacheStack.Outputs.KMSKeyArn
    Export:
      Name: !Sub "${AWS::StackName}-ElastiCacheKMSKeyArn"

  AmazonMQSecretArn:
    Condition: IsShared
    Description: Shared AmazonMQ Password Secret ARN
    Value: !GetAtt AmazonMQStack.Outputs.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-AmazonMQSecretArn"

  AmazonMQKMSKeyArn:
    Condition: IsShared
    Description: Shared AmazonMQ KMS Key ARN
    Value: !GetAtt AmazonMQStack.Outputs.KMSKeyArn
    Export:
      Name: !Sub "${AWS::StackName}-AmazonMQKMSKeyArn"

  MSKClusterArn:
    Condition: IsShared
    Description: Shared MSK Cluster ARN
    Value: !GetAtt MSKStack.Outputs.ClusterArn
    Export:
      Name: !Sub "${AWS::StackName}-MSKClusterArn"

  MSKSecretArn:
    Condition: IsShared
    Description: Shared MSK SASL/SCRAM Secret ARN
    Value: !GetAtt MSKStack.Outputs.SecretArn
    Export:
      Name: !Sub "${AWS::StackName}-MSKSecretArn"

  MSKKMSKeyArn:
    Condition: IsShared
    Description: Shared MSK KMS Key ARN
    Value: !GetAtt MSKStack.Outputs.KMSKeyArn
    Export:
      Name: !Sub "${AWS::StackName}-MSKKMSKeyArn"

  ReporterStorageBucketName:
    Condition: SharedReporterBucket
    Description: S3 bucket for Reporter object storage
    Value: !Ref ReporterStorageBucket
    Export:
      Name: !Sub "${AWS::StackName}-ReporterStorageBucketName"

  FetcherStorageBucketName:
    Condition: SharedFetcherBucket
    Description: S3 bucket for Fetcher object storage
    Value: !Ref FetcherStorageBucket
    Export:
      Name: !Sub "${AWS::StackName}-FetcherStorageBucketName"

  ObjectStorageRoleArn:
    Condition: HasObjectStorageBucket
    Description: IRSA role ARN reporter/fetcher pods assume for S3 access
    Value: !GetAtt ObjectStorageRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ObjectStorageRoleArn"


  PlatformNamespace:
    Condition: ShouldDeployApplication
    Description: Kubernetes namespace where the platform is deployed
    Value: !Ref PlatformNamespace
    Export:
      Name: !Sub "${AWS::StackName}-PlatformNamespace"

  KubeconfigCommand:
    Description: Command to configure kubectl
    Value: !Sub
      - "aws eks update-kubeconfig --name ${ClusterName} --region ${AWS::Region}"
      - ClusterName: !If [CreateNewCluster, !GetAtt EKSStack.Outputs.ClusterName, !Ref ExistingClusterName]

  CheckPodsCommand:
    Condition: ShouldDeployApplication
    Description: Command to check platform pods status
    Value: !Sub "kubectl get pods -n ${PlatformNamespace}"
