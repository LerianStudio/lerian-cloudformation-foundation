      # Module: Ledger
      EnableLedger:
        default: "Deploy Ledger (Midaz)"
      LedgerChartVersion:
        default: "Ledger (Midaz) Chart Version"
      LedgerValuesOverride:
        default: "Ledger Values Override (advanced)"
      # Module: Reporter
      EnableReporter:
        default: "Deploy Reporter"
